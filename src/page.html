<title>シサミル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* ホールの島の看板とデータカウンター。看板は機種ごとの色、示唆はステッカー、設定判別はカウンターの電光表示で見せる */
:root {
  /* 地・文字・ふち */
  --bg: #EEF0FF;
  --dot-a: #FFD3E4;
  --dot-b: #CBE2FF;
  --surface: #FFFFFF;
  --ink: #1B1F45;
  --muted: #5A6190;
  --edge: #1B1F45;
  --line: #E1E4F5;
  --line-strong: #B9BFE0;
  /* ポップな5色（ピンクは「数える・判別」の色） */
  --pink: #FF3D8B; --pink-deep: #D1145F; --pink-soft: #FFE0EC; --on-pink: #FFFFFF;
  --sky: #2A8BF2; --sky-soft: #D9EBFF;
  --mint: #14B886; --mint-soft: #D3F6E9;
  --sun: #FFC83A; --sun-soft: #FFF3C7;
  --grape: #7C4DFF; --grape-soft: #ECE4FF;
  --on-color: #FFFFFF; --on-sun: #2A2000;
  --hot: #D1145F;
  --track: #E6E9F7;
  --memo-bg: #FFF6CF; --memo-line: #E9C24A;
  --img-bg: #DDE2F5;
  /* 機種の看板（機種を切り替えると上書きされる） */
  --m-a: #7CCBFF; --m-b: #2F8BEA; --m-ink: #FFFFFF; --m-shadow: #1B1F45; --m-hl: rgba(124, 203, 255, .6);
  --md-a: #2A4E86; --md-b: #1D3F78; --md-hl: rgba(47, 139, 234, .38);
  --hero-a: var(--m-a); --hero-b: var(--m-b); --hero-ink: var(--m-ink); --hero-shadow: var(--m-shadow); --hl: var(--m-hl);
  --hero-stripe: rgba(255, 255, 255, .16);
  /* データカウンター（判別ツール） */
  --led-bg: #171C44; --led-deep: #0D1130; --led-fg: #FFD84D; --led-glow: rgba(255, 216, 77, .5);
  --led-sub: #8FE3FF; --led-dim: #343C72; --led-muted: #AEB5E0; --led-edge: #1B1F45;
  /* 設定ごとの柱の色（電光表示の上で見えるよう明るめ。示唆の色と同じ順） */
  --k1: #B7BEE3; --k2: #4A8CFF; --k3: #FFD23F; --k4: #FF4D5E; --k5: #A374FF;
  /* ＋1（PUSHボタン） */
  --cnt-bg: #2A8BF2; --cnt-hi: #8CCBFF; --cnt-fg: #FFFFFF;
  /* 示唆の強さ（ランプの色） */
  --lv-base-bg: #E4E8F4; --lv-base-fg: #2C3355;
  --lv-oe-bg: #FFFFFF;   --lv-oe-fg: #2C3355;
  --lv-blue: #2F6BE0; --lv-green: #13914F; --lv-gold: #F5C21B; --lv-red: #E0283D; --lv-purple: #7B3FE4;
  --lv-on: #FFFFFF; --lv-gold-fg: #2A2000;
  --rain: linear-gradient(90deg, #FF9AA8, #FFD36E, #FFF08A, #9EE6A8, #8CCBFF, #C3A6FF);
  --rain-v: linear-gradient(0deg, #FF9AA8, #FFD36E, #FFF08A, #9EE6A8, #8CCBFF, #C3A6FF);
  --rain-fg: #241834;
  /* 写真の拡大 */
  --scrim: rgba(8, 12, 30, .94);
  --scrim-ink: #F3F6FF;
  --scrim-muted: #AEB8D6;
  --scrim-link: #9FD3FF;
  --badge-bg: rgba(27, 34, 68, .72);

  --font-display: 'Dela Gothic One', 'Hiragino Kaku Gothic StdN', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-led: 'DotGothic16', 'Osaka-Mono', 'MS Gothic', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1230; --dot-a: #2B1B45; --dot-b: #172955; --surface: #182047; --ink: #EEF1FF; --muted: #A7AED6;
    --edge: #04061A; --line: #2A3366; --line-strong: #414C8C;
    --pink: #FF5C9E; --pink-deep: #FF8DBA; --pink-soft: #4A1A38; --on-pink: #1A0B16;
    --sky: #5AAEFF; --sky-soft: #1C3366; --mint: #3DDCA6; --mint-soft: #11392F; --sun: #FFD45E; --sun-soft: #3A3115;
    --grape: #A58BFF; --grape-soft: #2C2357; --on-color: #0E1230; --on-sun: #2A2000;
    --hot: #FF8DBA; --track: #26305E; --memo-bg: #2E2812; --memo-line: #7D6824; --img-bg: #212A58;
    --hero-a: var(--md-a); --hero-b: var(--md-b); --hero-ink: #F4F6FF; --hero-shadow: #04061A; --hl: var(--md-hl);
    --hero-stripe: rgba(255, 255, 255, .07);
    --led-bg: #0A0D26; --led-deep: #04061A; --led-dim: #2A3163; --led-edge: #4A57A0;
    --cnt-bg: #4C9FF5; --cnt-hi: #A5D3FF; --cnt-fg: #0E1230;
    --lv-base-bg: #2A3358; --lv-base-fg: #D2D9F0; --lv-oe-bg: #182047; --lv-oe-fg: #E6EBFA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1230; --dot-a: #2B1B45; --dot-b: #172955; --surface: #182047; --ink: #EEF1FF; --muted: #A7AED6;
  --edge: #04061A; --line: #2A3366; --line-strong: #414C8C;
  --pink: #FF5C9E; --pink-deep: #FF8DBA; --pink-soft: #4A1A38; --on-pink: #1A0B16;
  --sky: #5AAEFF; --sky-soft: #1C3366; --mint: #3DDCA6; --mint-soft: #11392F; --sun: #FFD45E; --sun-soft: #3A3115;
  --grape: #A58BFF; --grape-soft: #2C2357; --on-color: #0E1230; --on-sun: #2A2000;
  --hot: #FF8DBA; --track: #26305E; --memo-bg: #2E2812; --memo-line: #7D6824; --img-bg: #212A58;
  --hero-a: var(--md-a); --hero-b: var(--md-b); --hero-ink: #F4F6FF; --hero-shadow: #04061A; --hl: var(--md-hl);
  --hero-stripe: rgba(255, 255, 255, .07);
  --led-bg: #0A0D26; --led-deep: #04061A; --led-dim: #2A3163; --led-edge: #4A57A0;
  --cnt-bg: #4C9FF5; --cnt-hi: #A5D3FF; --cnt-fg: #0E1230;
  --lv-base-bg: #2A3358; --lv-base-fg: #D2D9F0; --lv-oe-bg: #182047; --lv-oe-fg: #E6EBFA;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot-a) 1.7px, transparent 2.2px), radial-gradient(var(--dot-b) 1.7px, transparent 2.2px);
  background-size: 30px 30px;
  background-position: 0 0, 15px 15px;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
/* ホーム画面アプリ版は時計などの帯を看板の色にする */
html.app body::before { background: var(--hero-b); }
body.locked { overflow: hidden; }
a { color: var(--sky); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.gut {
  max-width: 880px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* 押すとへこむ */
.hbtn, .chip, .pager button, .jgo, .jundo, .js-close, .jcall, .jsmall.jbig { transition: transform .08s ease, box-shadow .08s ease; }
.hbtn:active, .chip[aria-current="true"]:active, .pager button:active, .jgo:active, .jundo:active, .js-close:active, .jcall:active, .jsmall.jbig:active {
  transform: translate(2px, 3px); box-shadow: 0 0 0 var(--edge);
}

/* ===== 看板（ヘッダー） ===== */
.hero {
  background-color: var(--hero-b);
  background-image: repeating-linear-gradient(135deg, var(--hero-stripe) 0 12px, transparent 12px 26px), linear-gradient(180deg, var(--hero-b), var(--hero-a));
  color: var(--hero-ink);
  border-bottom: 3px solid var(--edge);
}
.hero .gut { padding-block: 12px 16px; display: grid; gap: 12px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; min-width: 0; }
.logo b {
  font-family: var(--font-display); font-weight: 400; font-size: 15px; letter-spacing: .06em; line-height: 1.3;
  background: var(--surface); color: var(--pink-deep); border: 2px solid var(--edge); border-radius: 10px;
  padding: 1px 9px 2px; box-shadow: 2px 2px 0 var(--edge); transform: rotate(-3deg);
}
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero-name { min-width: 0; }
/* 機種のプルダウン：大きな機種名をタップすると切り替わる */
.picker { position: relative; display: block; cursor: pointer; }
.picker select {
  appearance: none; -webkit-appearance: none; width: 100%; cursor: pointer;
  font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 8vw, 42px); line-height: 1.2; letter-spacing: .02em;
  color: var(--hero-ink); background: transparent; border: 0; border-radius: 12px; padding: 2px 56px 6px 0; margin: 0;
  text-shadow: 0 4px 0 var(--hero-shadow), 2px 0 0 var(--hero-shadow), -2px 0 0 var(--hero-shadow), 0 -2px 0 var(--hero-shadow), 2px 2px 0 var(--hero-shadow), -2px 2px 0 var(--hero-shadow);
  text-overflow: ellipsis;
}
.picker select option { color: var(--ink); background: var(--surface); font-family: var(--font-body); font-size: 16px; text-shadow: none; }
.picker-btn {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%); pointer-events: none;
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  background: var(--sun); color: var(--on-sun); border: 2.5px solid var(--edge); box-shadow: 2px 3px 0 var(--edge);
}
.picker-btn svg { width: 22px; height: 22px; }
.fullname { font-size: 12px; font-weight: 700; margin-top: 2px; text-wrap: balance; }
.hero-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.hbtn {
  cursor: pointer; font-size: 13px; font-weight: 700; padding: 6px 12px; line-height: 1.4;
  border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); color: var(--ink);
  box-shadow: 2px 3px 0 var(--edge); display: inline-flex; align-items: center; gap: 5px;
}
.hbtn[aria-expanded="true"] { background: var(--sun); color: var(--on-sun); }
.hbtn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.jstart { background: var(--pink); color: var(--on-pink); font-weight: 900; font-size: 13.5px; padding: 7px 14px; }
.search { position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; font-weight: 500;
  padding: 10px 64px 10px 40px; border-radius: 16px; border: 2.5px solid var(--edge);
  background: var(--surface); color: var(--ink); box-shadow: 3px 4px 0 var(--edge);
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.qclear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  cursor: pointer; border: 0; background: var(--lv-base-bg); color: var(--ink);
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
}

/* 台の情報・色の見かた */
.sheet {
  margin-top: 16px; background: var(--surface); border: 2.5px solid var(--edge); border-radius: 20px;
  box-shadow: 3px 4px 0 var(--edge); padding: 14px 16px; display: grid; gap: 12px; font-size: 13.5px;
}
.sheet h2 { margin: 0; font-size: 15px; font-weight: 900; }
.sheet p { margin: 0; }
.spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 16px; margin: 0; }
.spec div { min-width: 0; }
.spec dt { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.spec dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet ul { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend-tags { display: grid; gap: 4px; color: var(--muted); }
.small { font-size: 12.5px; color: var(--muted); }

/* ===== 項目チップ（上に固定） ===== */
.subbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  background: var(--bg); border-bottom: 2.5px solid var(--edge);
}
.subbar .gut { padding-block: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 0 4px 4px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips.more { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.chip {
  flex: 0 0 auto; cursor: pointer; font-size: 14px; font-weight: 700; line-height: 1.4;
  padding: 7px 14px; border-radius: 999px; border: 2px solid var(--line-strong);
  background: var(--surface); color: var(--ink);
}
.chip[aria-current="true"] {
  background: var(--hero-b); color: var(--hero-ink); border-color: var(--edge); box-shadow: 2px 3px 0 var(--edge); font-weight: 900;
}
.search-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; min-height: 38px; }
.search-head .chip { padding: 5px 12px; font-size: 13px; }

/* ===== 本文 ===== */
main.gut { padding-block: 20px calc(116px + env(safe-area-inset-bottom, 0px)); }
.group + .group { margin-top: 36px; }
.ghead { display: grid; gap: 6px; margin-bottom: 16px; justify-items: start; }
.gkicker {
  font-size: 11.5px; font-weight: 900; letter-spacing: .08em; color: var(--hero-ink); background: var(--hero-b);
  border: 2px solid var(--edge); border-radius: 999px; padding: 0 10px;
}
.ghead h2 { font-family: var(--font-display); font-weight: 400; font-size: 25px; line-height: 1.35; margin: 0; text-wrap: balance; }
.mk { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 2px; }
.where { font-size: 13.5px; color: var(--muted); }
.src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
.src-label { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.src a {
  font-size: 12px; font-weight: 700; text-decoration: none; color: var(--ink);
  border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 2px 10px;
}
.src a::after { content: " ↗"; font-size: 11px; color: var(--muted); }
.hint { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--sky); }
.hint svg { width: 14px; height: 14px; }
.stack { display: grid; gap: 16px; }

/* 写真カード（ステッカー） */
.cards { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.wide { grid-template-columns: minmax(0, 1fr); }
.cards.solo { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
.card {
  background: var(--surface); border: 2.5px solid var(--edge); border-radius: 18px;
  box-shadow: 3px 4px 0 var(--edge); overflow: hidden; display: flex; flex-direction: column; min-width: 0; margin: 0;
}
.zoom {
  display: block; position: relative; width: 100%; padding: 0; border: 0; cursor: zoom-in;
  background: var(--img-bg);
}
.zoom img { display: block; width: 100%; height: auto; max-width: 100%; }
.card .zoom { border-bottom: 2.5px solid var(--edge); }
.cbody { padding: 10px 12px 11px; display: flex; flex-direction: column; align-items: flex-start; gap: 7px; flex: 1; min-width: 0; }
.see { font-weight: 900; font-size: 15px; line-height: 1.4; }
.sub { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: -3px; }
.res { font-size: 14px; line-height: 1.55; }
.res.hot { color: var(--hot); font-weight: 900; }
.credit { margin-top: auto; font-size: 11px; font-weight: 700; color: var(--muted); text-underline-offset: 2px; }
.card .credit { padding-top: 2px; }
.tag {
  display: inline-block; font-size: 10.5px; font-weight: 700; line-height: 1.5; color: var(--muted);
  border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; white-space: nowrap;
}
@media (max-width: 639px) {
  .cards.grid > .card:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .cards.grid > .card:last-child:nth-child(odd) .zoom img { max-width: 420px; margin: 0 auto; }
}
@media (min-width: 640px) {
  .cards.grid { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  .cards.wide { grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
}

/* 複数枚の写真は横にスワイプ */
.carousel {
  display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  padding: 0 6px 8px 4px; margin-inline: -4px;
}
.carousel > .card { flex: 0 0 82%; max-width: 380px; scroll-snap-align: start; }
.fig .cbody { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; }
.fig .see { font-size: 13.5px; font-weight: 700; }
.fig .credit { margin-top: 0; }
.single { max-width: 520px; }

/* 文字だけの一覧 */
.list {
  background: var(--surface); border: 2.5px solid var(--edge); border-radius: 18px;
  box-shadow: 3px 4px 0 var(--edge); overflow: hidden;
}
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center;
  padding: 12px 14px;
}
.row + .row, .list > * + .row, .list > .row + * { border-top: 2px dashed var(--line); }
.row.t { grid-template-columns: minmax(0, 1fr); gap: 3px; }
.lhs { min-width: 0; }
.lhs .sub { margin-top: 1px; }
.rshot { grid-column: 1 / -1; max-width: 460px; display: grid; gap: 4px; }
.rshot .zoom { border-radius: 12px; overflow: hidden; border: 2px solid var(--edge); }
.rshot .credit { justify-self: end; }
@media (min-width: 640px) {
  .row.t { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 6px 14px; align-items: start; }
}

/* ランプ色のシール */
.pill {
  display: inline-block; font-size: 12.5px; font-weight: 900; line-height: 1.4;
  padding: 3px 11px; border-radius: 999px; border: 2px solid var(--edge); white-space: nowrap;
  box-shadow: 1.5px 2px 0 var(--edge);
}
.lv-base { background: var(--lv-base-bg); color: var(--lv-base-fg); }
.lv-oe { background: var(--lv-oe-bg); color: var(--lv-oe-fg); border-style: dashed; }
.lv-blue { background: var(--lv-blue); color: var(--lv-on); }
.lv-green { background: var(--lv-green); color: var(--lv-on); }
.lv-gold { background: var(--lv-gold); color: var(--lv-gold-fg); }
.lv-red { background: var(--lv-red); color: var(--lv-on); }
.lv-purple { background: var(--lv-purple); color: var(--lv-on); }
.lv-rain { background: var(--rain); color: var(--rain-fg); }

/* 期待度バー */
.cap { padding: 10px 14px; font-size: 12px; color: var(--muted); }
.brow {
  display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 2px 12px;
  padding: 10px 14px; align-items: start; border-top: 2px dashed var(--line);
}
.blabel { font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.5; }
.bbody { min-width: 0; }
.btxt { font-size: 13px; line-height: 1.5; }
.btxt b { font-variant-numeric: tabular-nums; font-weight: 900; }
.btxt .m { color: var(--muted); }
.btxt.hot { color: var(--hot); font-weight: 900; }
.track { position: relative; height: 12px; border-radius: 6px; margin-top: 6px; background: var(--track); overflow: hidden; border: 1.5px solid var(--edge); }
.track .ext, .track .fill { position: absolute; top: 0; bottom: 0; left: 0; }
.track .ext { background: var(--sky-soft); }
.track .fill { background: linear-gradient(90deg, var(--sky), var(--pink)); }
.big { font-family: var(--font-display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--pink-deep); }
.big small { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.stat .track { width: 100%; margin-top: 0; }

/* 設定差の表 */
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; border-top: 1.5px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); font-weight: 700; }
thead th { font-size: 12px; color: var(--muted); font-weight: 700; border-top: 0; }
.s6 { background: var(--pink-soft); color: var(--pink-deep); font-weight: 900; }
thead th.s6 { color: var(--pink-deep); }

/* メモ（付せん） */
.memo {
  background: var(--memo-bg); border: 2px solid var(--memo-line); border-radius: 14px;
  padding: 10px 14px 12px; font-size: 13.5px; display: grid; gap: 4px; justify-items: start;
}
.memo b {
  font-size: 11px; letter-spacing: .12em; background: var(--sun); color: var(--on-sun); border: 1.5px solid var(--edge);
  border-radius: 999px; padding: 0 9px;
}
.memo p { margin: 0; }

/* 前へ・次へ */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 26px; }
.pager button {
  cursor: pointer; text-align: left; padding: 10px 12px; border-radius: 16px;
  border: 2px solid var(--edge); background: var(--surface); color: var(--ink); min-width: 0; box-shadow: 2px 3px 0 var(--edge);
}
.pager button:last-child { text-align: right; grid-column: 2; }
.pager small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.pager span { font-weight: 900; font-size: 14px; }
.foot { margin-top: 22px; font-size: 12px; color: var(--muted); }
.empty {
  padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px;
  border: 2px dashed var(--line-strong); border-radius: 18px; background: var(--surface);
}

/* ===== 下のタブ ===== */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.tabs {
  pointer-events: auto; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px;
  background: var(--surface); border: 2.5px solid var(--edge); border-radius: 24px; box-shadow: 3px 4px 0 var(--edge);
  padding: 5px;
}
.tab {
  cursor: pointer; border: 0; background: transparent; color: var(--muted);
  display: grid; justify-items: center; gap: 1px; padding: 5px 2px 4px; border-radius: 18px;
  font-size: 11px; font-weight: 900; line-height: 1.3; min-width: 0;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="true"] { background: var(--hero-b); color: var(--hero-ink); box-shadow: inset 0 0 0 2px var(--edge); }

/* ===== 示唆カードの＋1（PUSHボタン）と、数える案内 ===== */
.jcall {
  cursor: pointer; display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; margin-top: 6px;
  text-align: left; font-size: 13px; font-weight: 700; line-height: 1.4; padding: 10px 12px; border-radius: 16px;
  border: 2px solid var(--edge); background: var(--pink-soft); color: var(--ink); box-shadow: 2px 3px 0 var(--edge);
}
.jcall i {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--pink); color: var(--on-pink); border: 2px solid var(--edge);
}
.jcall svg { width: 18px; height: 18px; }
.jcall span { flex: 1; min-width: 0; }
.jcall b { white-space: nowrap; color: var(--pink-deep); font-weight: 900; }
.cnt {
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  font-size: 13.5px; font-weight: 900; line-height: 1; padding: 6px 6px 6px 13px; border-radius: 999px;
  border: 2px solid var(--edge); color: var(--cnt-fg);
  background: radial-gradient(120% 100% at 30% 15%, var(--cnt-hi), var(--cnt-bg) 62%);
  box-shadow: 2px 3px 0 var(--edge), inset 0 -3px 0 rgba(0, 0, 0, .16);
  transition: transform .08s ease, box-shadow .08s ease;
}
.cnt:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--edge), inset 0 -2px 0 rgba(0, 0, 0, .16); }
.cnt b {
  min-width: 24px; padding: 4px 7px; border-radius: 999px; background: var(--surface); color: var(--ink);
  font-variant-numeric: tabular-nums; text-align: center; border: 1.5px solid var(--edge);
}
.cnt.memo { background: var(--surface); color: var(--ink); border-style: dashed; box-shadow: none; }
.cnt.memo b { background: var(--lv-base-bg); }
.cnt.bump b { background: var(--sun); color: var(--on-sun); }
.row > .cnt { grid-column: 1 / -1; justify-self: start; }
body.judging main.gut { padding-bottom: calc(210px + env(safe-area-inset-bottom, 0px)); }

/* ===== 下の結果バー（小さなデータカウンター） ===== */
.jbar {
  position: fixed; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 7;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.jbar-in {
  position: relative; pointer-events: auto; max-width: 560px; margin: 0 auto; box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--led-bg); color: var(--led-muted); border: 2.5px solid var(--led-edge); border-radius: 20px;
  box-shadow: 3px 4px 0 var(--edge); padding: 8px 12px 8px 10px;
}
.jopen { cursor: pointer; border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; color: inherit; }
.jcap { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 900; color: var(--led-muted); margin-bottom: 4px; }
.jcap em { font-style: normal; color: var(--led-sub); white-space: nowrap; }
.jx {
  cursor: pointer; position: absolute; top: -11px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--edge); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 900; line-height: 1;
  display: grid; place-items: center; padding: 0; box-shadow: 1.5px 2px 0 var(--edge);
}
.jside { display: grid; gap: 6px; justify-items: end; }
.jhi { font-size: 11px; color: var(--led-muted); font-weight: 700; text-align: right; line-height: 1.3; }
.jhi b {
  display: block; font-family: var(--font-led); font-weight: 400; font-size: 24px; line-height: 1.1; color: var(--led-fg);
  text-shadow: 0 0 8px var(--led-glow); font-variant-numeric: tabular-nums;
}
.jbar .jsmall { background: transparent; color: var(--led-fg); border-color: var(--led-dim); }

/* 設定ごとの柱（ランプの色） */
.k1 { --k: var(--k1); }
.k2 { --k: var(--k2); }
.k3 { --k: var(--k3); }
.k4 { --k: var(--k4); }
.k5 { --k: var(--k5); }
.k6 { --k: var(--rain-v); }
.jcols { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 5px; align-items: end; height: 58px; }
.jcol { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; height: 100%; min-width: 0; }
.jcol .jp { font-family: var(--font-led); font-size: 11px; color: var(--led-fg); line-height: 1.2; font-variant-numeric: tabular-nums; }
.jcol .jt { width: 72%; background: var(--led-dim); border-radius: 4px 4px 2px 2px; position: relative; overflow: hidden; align-self: stretch; }
.jcol .jt span { position: absolute; left: 0; right: 0; bottom: 0; background: var(--k); border-radius: 4px 4px 2px 2px; }
.jcol.top .jt { box-shadow: 0 0 0 2px var(--led-fg); }
.jcol .js { font-size: 10px; color: var(--led-muted); font-weight: 700; line-height: 1.3; }
.jcol.top .js { color: var(--led-fg); }

/* ===== 判別画面 ===== */
.jsheet {
  border: 0; margin: 0; padding: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot-a) 1.7px, transparent 2.2px), radial-gradient(var(--dot-b) 1.7px, transparent 2.2px);
  background-size: 30px 30px; background-position: 0 0, 15px 15px;
  color: var(--ink);
}
.jsheet::backdrop { background: var(--scrim); }
.jsheet[open] { display: flex; flex-direction: column; }
.js-top {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px;
  background-color: var(--hero-b);
  background-image: repeating-linear-gradient(135deg, var(--hero-stripe) 0 12px, transparent 12px 26px), linear-gradient(180deg, var(--hero-b), var(--hero-a));
  color: var(--hero-ink); border-bottom: 3px solid var(--edge);
}
.js-top > div { display: flex; align-items: center; gap: 10px; min-width: 0; }
.js-top i {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: var(--pink); color: var(--on-pink); border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--edge);
}
.js-top i svg { width: 22px; height: 22px; }
.js-top h2 {
  margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.2;
  text-shadow: 0 3px 0 var(--hero-shadow), 2px 0 0 var(--hero-shadow), -2px 0 0 var(--hero-shadow), 0 -2px 0 var(--hero-shadow);
}
.js-top small { display: block; font-size: 12px; font-weight: 700; margin-top: 2px; }
.js-close {
  cursor: pointer; font-size: 14px; font-weight: 900; padding: 7px 16px; border-radius: 999px;
  border: 2px solid var(--edge); background: var(--surface); color: var(--ink); box-shadow: 2px 3px 0 var(--edge);
}
.js-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(28px + env(safe-area-inset-bottom, 0px));
}
.js-inner { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
/* 結果と切り替えは上に固定 */
.jstick {
  position: sticky; top: 0; z-index: 3; display: grid; gap: 10px;
  padding-block: 12px 10px; margin-inline: -4px; padding-inline: 4px; background: var(--bg);
  border-bottom: 2px solid var(--line);
}
.jpanel {
  background: var(--led-bg); color: var(--led-muted); border: 2.5px solid var(--led-edge); border-radius: 20px;
  box-shadow: 3px 4px 0 var(--edge); padding: 10px 12px; display: grid; gap: 8px; min-width: 0;
}
.jled { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: end; }
.jl-sum { display: grid; gap: 0; padding-right: 12px; border-right: 2px dashed var(--led-dim); }
.jl-sum span { font-size: 11.5px; font-weight: 900; color: var(--led-muted); letter-spacing: .04em; }
.jl-sum b {
  font-family: var(--font-led); font-weight: 400; font-size: 40px; line-height: 1; color: var(--led-fg);
  text-shadow: 0 0 10px var(--led-glow); font-variant-numeric: tabular-nums;
}
.jl-sum b small { font-size: 18px; margin-left: 2px; }
.jl-sum em { font-style: normal; font-size: 11px; color: var(--led-sub); font-weight: 700; margin-top: 4px; }
.jpanel .jcols { height: 74px; }
.jpanel .jcol .jp { font-size: 12px; }
.jpanel .jcol .js { font-size: 10.5px; }
.jcol.no .jp, .jcol.no .js { color: var(--led-dim); text-decoration: line-through; }
.jl-msg { font-size: 12.5px; font-weight: 700; color: var(--led-sub); line-height: 1.5; }
.jl-msg.bad { color: var(--led-fg); }
.jl-warn { font-size: 11.5px; color: var(--led-muted); margin: 0; }
/* 数える・示唆・しくみ の切り替え */
.jseg { display: flex; gap: 8px; align-items: center; }
.jtabs {
  flex: 1; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 999px; padding: 3px; box-shadow: 2px 3px 0 var(--edge);
}
.jtab {
  cursor: pointer; border: 0; background: transparent; color: var(--muted); border-radius: 999px;
  font-size: 13px; font-weight: 900; padding: 6px 2px; display: inline-flex; justify-content: center; align-items: center; gap: 3px; min-width: 0; white-space: nowrap;
}
.jtab[aria-selected="true"] { background: var(--pink); color: var(--on-pink); }
.jtab .bd {
  min-width: 18px; height: 18px; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; padding: 0 4px;
  background: var(--sun); color: var(--on-sun); font-variant-numeric: tabular-nums;
}
.jundo {
  cursor: pointer; flex: 0 0 auto; font-size: 12.5px; font-weight: 900; padding: 8px 12px; border-radius: 999px;
  border: 2px solid var(--edge); background: var(--surface); color: var(--ink); box-shadow: 2px 3px 0 var(--edge); white-space: nowrap;
}
.jundo[disabled] { opacity: .45; cursor: default; box-shadow: none; }

/* 判別画面のカード（見出しの四角の色で種類を分ける） */
.jcard {
  --c: var(--sky);
  background: var(--surface); border: 2.5px solid var(--edge); border-radius: 20px; box-shadow: 3px 4px 0 var(--edge);
  padding: 14px; display: grid; gap: 12px; min-width: 0;
}
.jcard.c-sun { --c: var(--sun); }
.jcard.c-mint { --c: var(--mint); }
.jcard.c-grape { --c: var(--grape); }
.jcard.c-pink { --c: var(--pink); }
.jcard h3 { margin: 0; font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; line-height: 1.35; }
.jcard h3::before {
  content: ""; flex: 0 0 auto; width: 14px; height: 14px; border-radius: 5px; background: var(--c); border: 2px solid var(--edge);
  transform: rotate(8deg);
}
.jcard .small { margin: 0; }
.jguide { background: var(--sun-soft); }
.jsteps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: st; }
.jsteps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 10px; counter-increment: st; }
.jsteps li::before {
  content: counter(st); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--pink); color: var(--on-pink); font-weight: 900; font-size: 14px; border: 2px solid var(--edge);
}
.jsteps b { font-size: 14px; font-weight: 900; }
.jsteps span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
/* 通常時のゲーム数（電光表示の入力） */
.jgames { display: grid; gap: 10px; }
.jgames label { font-size: 12px; font-weight: 700; color: var(--muted); }
.jledin { position: relative; }
.jledin input {
  width: 100%; box-sizing: border-box; font-family: var(--font-led); font-size: 34px; font-weight: 400; text-align: right;
  font-variant-numeric: tabular-nums; padding: 8px 48px 8px 14px; border-radius: 14px; border: 2.5px solid var(--led-edge);
  background: var(--led-bg); color: var(--led-fg); text-shadow: 0 0 10px var(--led-glow); box-shadow: inset 0 3px 0 var(--led-deep);
}
.jledin input::placeholder { color: var(--led-dim); }
.jledin span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-family: var(--font-led); color: var(--led-muted); font-size: 16px; pointer-events: none; }
.jledin.sg input { padding-left: 58px; }
.jsign {
  cursor: pointer; position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 42px; height: 36px; border-radius: 10px;
  border: 2px solid var(--led-dim); background: var(--led-deep); color: var(--led-fg); font-family: var(--font-led); font-size: 18px; line-height: 1; padding: 0;
}
.jydl .jledin input { font-size: 24px; padding-block: 5px; }
.jydl .jsign { height: 30px; width: 38px; }
.jplus { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.jplus .jbtn:nth-child(1) { background: var(--sky); color: var(--on-color); }
.jplus .jbtn:nth-child(2) { background: var(--mint); color: var(--on-color); }
.jplus .jbtn:nth-child(3) { background: var(--sun); color: var(--on-sun); }
.jplus .jbtn:nth-child(4) { background: var(--pink); color: var(--on-pink); }
.jbtn {
  cursor: pointer; font-size: 16px; font-weight: 900; padding: 10px 4px; border-radius: 14px; line-height: 1.2;
  border: 2px solid var(--edge); background: var(--cnt-bg); color: var(--cnt-fg); box-shadow: 2px 3px 0 var(--edge);
  font-variant-numeric: tabular-nums; transition: transform .08s ease, box-shadow .08s ease;
}
.jbtn:active { transform: translate(2px, 3px); box-shadow: 0 0 0 var(--edge); }
.jbtn.minus { background: var(--surface); color: var(--ink); }
/* 数えるカウンター */
.jitem { display: grid; gap: 8px; padding-top: 12px; border-top: 2px dashed var(--line); min-width: 0; }
.jitem:first-of-type { border-top: 0; padding-top: 0; }
.jhead { display: flex; justify-content: space-between; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; }
.jhead .nm { font-weight: 900; font-size: 15px; line-height: 1.4; }
.jhead .ob {
  font-size: 12.5px; font-weight: 900; color: var(--pink-deep); font-variant-numeric: tabular-nums;
  background: var(--pink-soft); border-radius: 999px; padding: 1px 9px;
}
.jctr { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.jctr.pair { display: grid; gap: 8px; }
.jone { display: inline-flex; align-items: center; gap: 8px; }
.jctr.pair .jone { display: grid; grid-template-columns: minmax(0, 1fr) 44px 3em 56px; }
.jone .cap { font-size: 13px; font-weight: 700; color: var(--muted); min-width: 0; }
.jone .num { min-width: 2.4em; text-align: center; font-family: var(--font-display); font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.jone .jbtn { width: 56px; padding: 9px 0; font-size: 20px; }
.jone .jbtn.minus { width: 44px; font-size: 18px; }
/* 計算に入れる（スイッチ） */
.jsw {
  cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 4px 0;
  font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.jsw .tk {
  width: 42px; height: 24px; border-radius: 12px; background: var(--track); border: 2px solid var(--edge); position: relative; flex: 0 0 auto;
  transition: background .12s ease;
}
.jsw .tk::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--edge); transition: transform .12s ease;
}
.jsw[aria-checked="true"] { color: var(--ink); }
.jsw[aria-checked="true"] .tk { background: var(--mint); }
.jsw[aria-checked="true"] .tk::after { transform: translateX(18px); }
.jsw[aria-disabled="true"] { cursor: default; }
/* 設定ごとの値（近い設定に色） */
.jrefs { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 4px; }
.rf {
  display: grid; gap: 0; justify-items: center; text-align: center; padding: 4px 2px; border-radius: 10px;
  background: var(--bg); border: 1.5px solid var(--line); min-width: 0; font-variant-numeric: tabular-nums;
}
.rf i { font-style: normal; font-size: 10px; font-weight: 700; color: var(--muted); line-height: 1.3; }
.rf b { font-size: 12px; font-weight: 900; line-height: 1.3; letter-spacing: -.02em; }
.rf.near { background: var(--pink); border-color: var(--edge); color: var(--on-pink); box-shadow: 1.5px 2px 0 var(--edge); }
.rf.near i { color: var(--on-pink); }
.jrefcap { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: -4px; }
.jwhere { font-size: 12.5px; color: var(--muted); margin: 0; }
/* 目安（設定1と比べる） */
.jbase { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.jbase span b { color: var(--ink); font-variant-numeric: tabular-nums; }
.vd { font-size: 12px; font-weight: 900; border-radius: 999px; padding: 2px 10px; background: var(--bg); color: var(--muted); border: 1.5px solid var(--line-strong); }
.vd.good { background: var(--pink); color: var(--on-pink); border-color: var(--edge); }
.vd.same { background: var(--sun-soft); color: var(--ink); border-color: var(--edge); }
.vd.bad { background: var(--sky-soft); color: var(--ink); border-color: var(--edge); }
/* 有利区間 */
.jyled {
  display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 10px 14px; border-radius: 16px;

    }
    else if (/高設定/.test(t)) {
      var k = /強/.test(t) ? 1.5 : /中/.test(t) ? 1.0 : 0.5;
      w = S.map(function (s) { return 1 + k * x(s); });
    }
    if ((m = t.match(/設定(\d)を?否定/))) w = w.map(function (v, i) { return S[i] === +m[1] ? 0 : v; });
    if (it.tag === '推測') w = w.map(function (v) { return v === 0 ? 0.15 : v; });
    return w;
  }
  function countKind(g, it) {
    if (!M.judge) return null;
    if (it.rate) return 'rate';
    if (g.tab.id === 'setting' && (PILL[it.lv] || it.count)) return 'set';
    if ((M.judge.memo || []).indexOf(g.id) !== -1) return 'memo';
    return null;
  }
  function buildHints() {
    HINTS = {};
    if (!M.judge) return;
    M.flat.forEach(function (g) {
      (g.items || []).forEach(function (it) {
        var k = countKind(g, it);
        if (k === 'set' || k === 'memo') HINTS[hintKey(g, it)] = { kind: k, it: it, g: g, w: k === 'set' ? hintWeights(it, M.judge.settings) : null };
      });
    });
  }
  function cntHTML(g, it) {
    if (!judgeOn || !M.judge) return '';
    var k = countKind(g, it);
    if (!k) return '';
    var key = k === 'rate' ? 'r:' + it.rate : hintKey(g, it);
    var n = k === 'rate' ? (J.r[it.rate] || 0) : (J.h[key] || 0);
    return '<button type="button" class="cnt' + (k === 'memo' ? ' memo' : '') + '" data-hk="' + esc(key) + '" aria-label="' + esc(it.see + 'を1回数える') + '">＋1' + (k === 'memo' ? ' メモ' : '') + '<b>' + n + '</b></button>';
  }

  // 最初の見込み：flat はどの設定も同じ、low は低い設定ほど多い（1つ上がるごとに0.6倍）、high は高い設定ほど多い（1つ下がるごとに0.75倍）
  var PRIORS = [['flat', '均等'], ['low', 'ふだん'], ['high', '高設定狙い']];
  var prior = recall('shisa.prior');
  if (!PRIORS.some(function (x) { return x[0] === prior; })) prior = 'flat';
  function priorW(S) {
    var n = S.length;
    return S.map(function (s, i) { return prior === 'low' ? Math.pow(0.6, i) : prior === 'high' ? Math.pow(0.75, n - 1 - i) : 1; });
  }
  // 設定ごとの確からしさ（最初の見込みに、数えたものが各設定でどれくらい起きやすいかを掛け合わせる）
  // wt：ほかの要素と重なる分があるものは、重みを下げて掛け合わせる
  function judgeCalc() {
    var Jd = M.judge, S = Jd.settings, L = priorW(S).map(function (w) { return Math.log(w); });
    var used = 0, warn = [], hard = S.map(function () { return false; });
    var G0 = Math.max(0, Math.floor(J.games));
    Jd.rates.forEach(function (r) {
      var k = J.r[r.id] || 0, G = gFor(r), wt = r.wt || 1;
      if (!rateOn(r.id)) return;
      if (!k && !G) return;
      // 同じ当たりを別の数え方で数えているときは、二重にならないように外す
      var dup = (r.skipIf || []).filter(function (id) { return (J.t[id] || [])[0] > 0; });
      if (dup.length) {
        warn.push('「' + r.label + '」は「' + dup.map(function (id) { return (Jd.pairs.filter(function (x) { return x.id === id; })[0] || {}).label || id; }).join('」「') + '」と同じ当たりを数えることになるため、計算から外しています。');
        return;
      }
      if (!G) { warn.push(gForName(r) + 'を入れると「' + r.label + '」が計算に入ります。'); return; }
      var n = Math.max(G, k);
      if (k > G) warn.push('「' + r.label + '」が' + gForName(r) + 'より多くなっています。');
      S.forEach(function (s, i) { var p = 1 / r.p[i]; L[i] += wt * (k * Math.log(p) + (n - k) * Math.log(1 - p)); });
      used++;
    });
    // 引いた回数と当たった回数（当たり方が複数あるときは、それぞれ別に掛け合わせる）
    (Jd.pairs || []).forEach(function (r) {
      var t = J.t[r.id] || [], a = t[0] || 0;
      pOuts(r).forEach(function (o, j) {
        var raw = t[j + 1] || 0, h = Math.min(raw, a);
        if (raw > a) warn.push('「' + r.label + '」で「' + o.b + '」が「' + r.a + '」より多くなっています。');
        if (!a) return;
        S.forEach(function (s, i) {
          var q = o.p[i] / 100;
          L[i] += (r.wt || 1) * ((h ? h * Math.log(q) : 0) + (a > h ? (a - h) * Math.log(1 - q) : 0));
        });
      });
      if (a) used++;
    });
    Object.keys(J.h).forEach(function (key) {
      var c = J.h[key], info = HINTS[key];
      if (!c || !info || info.kind !== 'set') return;
      S.forEach(function (s, i) {
        if (info.w[i] > 0) L[i] += c * Math.log(info.w[i]); else { L[i] = -Infinity; hard[i] = true; }
      });
      used++;
    });
    var mx = Math.max.apply(null, L);
    if (mx === -Infinity) return { bad: true, warn: warn, used: used, hard: hard };
    var e = L.map(function (v) { return Math.exp(v - mx); });
    var sum = e.reduce(function (a, b) { return a + b; }, 0);
    var p = e.map(function (v) { return v / sum; });
    var top = p.indexOf(Math.max.apply(null, p));
    var high = p.reduce(function (a, v, i) { return a + (S[i] >= 4 ? v : 0); }, 0);
    return { p: p, top: top, high: high, used: used, warn: warn, hard: hard, games: G0 };
  }
  function pct(v) {
    if (v === 0) return '0%';
    if (v < 0.01) return '1%未満';
    return Math.round(v * 100) + '%';
  }

  // 設定ごとの柱の色（示唆の色と同じ順：設定2は青、3は黄、4は赤、5は紫、6は虹）
  function kc(s) { return ' k' + Math.min(6, Math.max(1, s)); }

  function jBarHTML(R) {

  // name：読み上げ用の名前（見出しの名前を使うとき）
  function counterHTML(act, id, idx, n, cap, name) {

  // いまの数値にいちばん近い設定（同じ値の設定はまとめて）

  var jTab = 'count';

  function jCountHTML(G) {

      h += '<section class="jcard c-pink"><h3>' + esc(Jd.atTitle || 'AT中に数えるもの') + '</h3>' + (Jd.atNote ? '<p class="small">' + esc(Jd.atNote) + '</p>' : '') +
        (needGA ? '<div class="jgames"><label for="j-ga">' + esc(atName()) + '（ボーナス・AT・ST中に回したゲーム数）</label>' + ledField('j-ga', J.ga || 0, 'G') +
          '<div class="jplus">' + [1, 10, 100, 500].map(function (v) { return '<button type="button" class="jbtn" data-act="ga" data-d="' + v + '">＋' + v + '</button>'; }).join('') + '</div></div>' : '') +
        atRates.map(rateRow).join('') + atMarks.map(markRow).join('') + '</section>';

  }

  // 「示唆」：示唆ページの＋1と、数えた示唆の一覧
  function jHintTabHTML() {
    var Jd = M.judge;
    var h = '<section class="jcard c-pink"><h3>示唆ページで数える</h3>' +
      '<p class="small">ONにすると、示唆のカードに「＋1」ボタンが出て、画面の下に結果のバーが出ます。終了画面などを見たら、そのカードの「＋1」を押してください。</p>' +
      '<div class="jmode"><button type="button" class="jsw" role="switch" data-act="mode" aria-checked="' + judgeOn + '"><span class="tk"></span>示唆ページの「＋1」</button>' +
      '<button type="button" class="jgo" data-act="goto">示唆のページへ ›</button></div></section>';

  }

  function warnHTML(R) {
    if (R.bad || !R.warn.length) return '';
    return '<div class="jwarn">' + R.warn.map(function (w) { return '<p>' + esc(w) + '</p>'; }).join('') + '</div>';
  }
  function jResultHTML(R) {
    var S = M.judge.settings, msg;
    if (R.bad) {
      return '<div class="jl-msg bad">数えた示唆どうしが食い違っていて、どの設定も当てはまりません。押し間違いがないか「示唆」の記録を確かめてください（「推測」の示唆が外れた可能性もあります）。</div>';
    }
    if (!R.used) msg = 'まだ何も数えていません。まずは' + gName() + 'と初当りの回数を入れてみましょう。';
    else if (R.games < 1500 && !R.hard.some(Boolean)) msg = 'まだ回数が少ないので、ぶれやすいです。回すほど正確になります。';
    else if (R.p[R.top] >= 0.6) msg = '設定' + S[R.top] + 'の見込みがいちばん高いです。';
    else msg = 'いちばん近いのは設定' + S[R.top] + '。まだはっきりしません。';

  var drawing = false;
  function jRefresh(full) {
    if (!M.judge || drawing) return;
    drawing = true;
    try { jDraw(full); } finally { drawing = false; }
  }
  function jDraw(full) {
    var R = judgeCalc();
    if (judgeOn) jBar.innerHTML = '<div class="jbar-in">' + jBarHTML(R) + '</div>';
    if (jSheet.open) {
      if (full) {
        var y = jBody.scrollTop, f = document.activeElement;

        jBody.scrollTop = y;
      } else {
        var box = document.getElementById('js-result'), wb = document.getElementById('js-warn'), ub = document.getElementById('js-undo');
        if (box) box.innerHTML = jResultHTML(R);
        if (wb) wb.innerHTML = warnHTML(R);

        if (ysum) ysum.innerHTML = ySumHTML();

  }
  function syncCnt(key) {
    var n = key.indexOf('r:') === 0 ? (J.r[key.slice(2)] || 0) : (J.h[key] || 0);
    Array.prototype.forEach.call(document.querySelectorAll('.cnt'), function (b) {
      if (b.getAttribute('data-hk') !== key) return;
      b.querySelector('b').textContent = n;
      b.classList.add('bump');
      setTimeout(function () { b.classList.remove('bump'); }, 150);
    });
  }

  // 記録を変える（log に残して「1つ戻す」で戻せるようにする）
  function rateOn(id) { return !!(J.on[id] || J.r[id] > 0); }
  function jApply(op, record) {
    if (op[0] === 'g') J.games = Math.max(0, Math.floor(J.games) + op[1]);
    else if (op[0] === 'G') J.games = op[2];
    else if (op[0] === 'a') J.ga = Math.max(0, Math.floor(J.ga || 0) + op[1]);
    else if (op[0] === 'A') J.ga = op[2];
    else if (op[0] === 'Y') J.y = clone(op[2]);
    else if (op[0] === 'r') {
      if (record && op[2] > 0) op[3] = !!J.on[op[1]];
      J.r[op[1]] = Math.max(0, (J.r[op[1]] || 0) + op[2]);
      if (op[2] > 0) J.on[op[1]] = true;
    }
    else if (op[0] === 'on') J.on[op[1]] = op[2];
    else if (op[0] === 't') {
      var t = J.t[op[1]] || [];
      for (var k = 0; k <= op[2]; k++) t[k] = t[k] || 0;
      t[op[2]] = Math.max(0, t[op[2]] + op[3]);
      J.t[op[1]] = t;
    }
    else if (op[0] === 'h') { J.h[op[1]] = Math.max(0, (J.h[op[1]] || 0) + op[2]); if (!J.h[op[1]]) delete J.h[op[1]]; }
    if (record) { J.log.push(op); if (J.log.length > 200) J.log.shift(); }
    resetAsk = false;
    jSave();
  }
  function jUndo() {
    var op = J.log.pop();
    if (!op) return;
    if (op[0] === 'g') jApply(['g', -op[1]]);
    else if (op[0] === 'G') jApply(['G', op[2], op[1]]);
    else if (op[0] === 'a') jApply(['a', -op[1]]);
    else if (op[0] === 'A') jApply(['A', op[2], op[1]]);
    else if (op[0] === 'Y') jApply(['Y', op[2], op[1]]);
    else if (op[0] === 'r') {
      jApply(['r', op[1], -op[2]]);
      if (op[3] === false) J.on[op[1]] = false;
      jSave();
      syncCnt('r:' + op[1]);
    }
    else if (op[0] === 'on') jApply(['on', op[1], !op[2]]);
    else if (op[0] === 't') jApply(['t', op[1], op[2], -op[3]]);
    else if (op[0] === 'h') { jApply(['h', op[1], -op[2]]); syncCnt(op[1]); }
    jRefresh(true);
  }
  function rerender() { if (qEl.value) search(); else show(M.id, current ? current.id : null, false); }
  function jAct(b) {
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), d = +b.getAttribute('data-d');
    if (act === 'open') { openSheet(); return; }
    if (act === 'off') { setJudge(false, true); rerender(); return; }
    if (act === 'guide-ok') { guideShow = false; store('shisa.judgeGuide', '1'); jRefresh(true); return; }
    if (act === 'guide') { guideShow = true; jRefresh(true); jBody.scrollTop = 0; return; }
    if (act === 'tab') { jTab = id; jRefresh(true); jBody.scrollTop = 0; return; }
    if (act === 'prior') { prior = id; store('shisa.prior', id); jRefresh(true); return; }
    if (act === 'mode') { setJudge(!judgeOn, true); rerender(); jRefresh(true); return; }
    if (act === 'goto') {
      var t = M.tabs.filter(function (x) { return x.id === 'setting'; })[0] || M.tabs[0];
      setJudge(true, true);
      jSheet.close();
      if (qEl.value) { qEl.value = ''; qClear.hidden = true; }
      show(M.id, current && current.tab === t ? current.id : t.groups[0].id, true);
      return;
    }
    if (act === 'undo') { jUndo(); return; }
    if (act === 'reset') { resetAsk = true; jRefresh(true); return; }
    if (act === 'reset-no') { resetAsk = false; jRefresh(true); return; }
    if (act === 'reset-yes') { J = jBlank(); resetAsk = false; jSave(); show(M.id, current ? current.id : null, false); jRefresh(true); return; }
    if (act === 'on') { if (J.r[id] > 0) return; jApply(['on', id, !J.on[id]], true); jRefresh(true); return; }
    if (act === 'g') jApply(['g', d], true);
    else if (act === 'ga') jApply(['a', d], true);
    else if (act === 'ymode' || act === 'ycut' || act === 'yadd' || act === 'yinv' || act === 'yneg') {
      var prevY = clone(J.y), y = J.y;
      if (act === 'ymode') y.mode = id === 'direct' ? 'direct' : 'money';
      else if (act === 'yinv') y.inv = Math.max(0, y.inv + d);
      else if (act === 'yadd') y.now = (y.now || 0) + d;
      else if (act === 'yneg') y[id === 'start' ? 'start' : 'now'] = -(y[id === 'start' ? 'start' : 'now'] || 0);
      else if (act === 'ycut') {
        var c = yCalc(), d0 = new Date();
        y.hist.push({ at: c.cur, gain: c.gained, inv: y.mode === 'money' ? y.inv : null, hold: y.mode === 'money' ? y.hold : null,
          t: ('0' + d0.getHours()).slice(-2) + ':' + ('0' + d0.getMinutes()).slice(-2) });
        if (y.hist.length > 50) y.hist.shift();
        y.start = c.cur;
      }
      y.used = true;
      jApply(['Y', prevY, clone(y)], true);
    }
    else if (act === 'r') { if (d < 0 && !(J.r[id] > 0)) return; jApply(['r', id, d], true); syncCnt('r:' + id); }
    else if (act === 't') { var i = +b.getAttribute('data-i'), t = J.t[id] || []; if (d < 0 && !(t[i] > 0)) return; jApply(['t', id, i, d], true); }
    else if (act === 'h') { if (d < 0 && !(J.h[id] > 0)) return; jApply(['h', id, d], true); syncCnt(id); }
    jRefresh(true);
  }
  function openSheet() {
    resetAsk = false;
    jBody.innerHTML = jSheetHTML(judgeCalc());
    document.getElementById('js-name').textContent = M.short;
    if (jSheet.showModal) { jSheet.showModal(); document.body.classList.add('locked'); }
  }
  function setJudge(on, keep) {
    judgeOn = !!(on && M.judge);
    if (keep) store('shisa.judgeOn', on ? '1' : '0');
    jBar.hidden = !judgeOn;
    document.body.classList.toggle('judging', judgeOn);
    jRefresh(false);
  }
  function judgeMachine(m) {
    jBtn.hidden = !m.judge;
    jTab = 'count';
    if (m.judge) { J = jLoad(m); buildHints(); }
    setJudge(recall('shisa.judgeOn') === '1', false);
  }

  // ヘッダーのボタンは判別画面を開く。開いたら示唆ページの＋1もONにする
  jBtn.addEventListener('click', function () {
    if (!judgeOn) { setJudge(true, true); rerender(); }
    openSheet();
  });
  jBar.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b) jAct(b); });
  jBody.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b) jAct(b); });
  var FIELD = { 'j-games': 'games', 'j-ga': 'ga', 'j-yinv': 'inv', 'j-yhold': 'hold', 'j-yrate': 'rate', 'j-ynow': 'now', 'j-ystart': 'start' };
  jBody.addEventListener('input', function (e) {
    var f = FIELD[e.target.id];
    if (!f) return;
    var v = Math.floor(+e.target.value || 0);
    if (f === 'games' || f === 'ga') {
      if (gPrev == null) gPrev = J[f];
      J[f] = Math.max(0, v);
    } else {
      if (gPrev == null) gPrev = clone(J.y);
      J.y[f] = f === 'rate' ? (e.target.value === '' ? 46 : Math.max(1, v)) : (f === 'inv' || f === 'hold') ? Math.max(0, v) : v;
      J.y.used = true;
    }
    jSave();
    jRefresh(false);
    if (judgeOn) jBar.innerHTML = '<div class="jbar-in">' + jBarHTML(judgeCalc()) + '</div>';
  });
  jBody.addEventListener('change', function (e) {
    var f = FIELD[e.target.id];
    if (!f) return;
    var prev = gPrev;
    gPrev = null;
    if (f === 'games' || f === 'ga') {
      if (prev != null && prev !== J[f]) J.log.push([f === 'games' ? 'G' : 'A', prev, J[f]]);
    } else {
      if (prev && JSON.stringify(prev) !== JSON.stringify(J.y)) J.log.push(['Y', prev, clone(J.y)]);
    }
    jSave();
    jRefresh(true);
  });
  document.getElementById('js-close').addEventListener('click', function () { jSheet.close(); });
  jSheet.addEventListener('close', function () { document.body.classList.remove('locked'); });

  // 拡大表示
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  var lbPrev = document.getElementById('lb-prev');
  var lbNext = document.getElementById('lb-next');
  var shots = [], at = 0;
  function paint() {
    var b = shots[at];
    lbImg.src = b.getAttribute('data-img');
    lbImg.alt = b.getAttribute('data-cap');
    document.getElementById('lb-cap').textContent = b.getAttribute('data-cap');
    var res = b.getAttribute('data-res');
    document.getElementById('lb-res').innerHTML = res ? resHTML(res, b.getAttribute('data-lv')) : '';
    document.getElementById('lb-src').href = b.getAttribute('data-src');
    document.getElementById('lb-count').textContent = (at + 1) + ' / ' + shots.length;
    lbPrev.disabled = at === 0;
    lbNext.disabled = at === shots.length - 1;
  }
  function step(d) { var n = at + d; if (n >= 0 && n < shots.length) { at = n; paint(); } }
  viewEl.addEventListener('click', function (e) {
    if (e.target.closest('.jcall')) { setJudge(true, true); rerender(); return; }
    var c = e.target.closest('.cnt');
    if (c) {
      var hk = c.getAttribute('data-hk');
      if (hk.indexOf('r:') === 0) jApply(['r', hk.slice(2), 1], true);
      else jApply(['h', hk, 1], true);
      syncCnt(hk);
      jRefresh(false);
      return;
    }
    var b = e.target.closest('.zoom');
    if (b) {
      shots = Array.prototype.slice.call(b.closest('.group').querySelectorAll('.zoom'));
      at = shots.indexOf(b);
      paint();
      if (lb.showModal) { lb.showModal(); document.body.classList.add('locked'); }
      return;
    }
    var p = e.target.closest('.pager [data-g]');
    if (p) show(M.id, p.getAttribute('data-g'), true);
  });
  lbPrev.addEventListener('click', function () { step(-1); });
  lbNext.addEventListener('click', function () { step(1); });
  document.getElementById('lb-close').addEventListener('click', function () { lb.close(); });
  lb.addEventListener('close', function () { document.body.classList.remove('locked'); });
  lb.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  var sx = null, sy = null;
  var stage = document.getElementById('lb-stage');
  stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (sx == null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    sx = null;
  });
  stage.addEventListener('click', function (e) { if (e.target === stage) lb.close(); });

  // 開く場所：#機種-項目 → 前のURL（#end など、青ブタ）→ 前回見ていた所
  function fromHash() {
    var h = (location.hash || '').slice(1), dash = h.indexOf('-');
    if (dash > 0 && machineById(h.slice(0, dash))) return [h.slice(0, dash), h.slice(dash + 1)];
    var a = machineById('aobuta');
    if (h && a && (groupById(a, h) || (a.old && a.old[h]))) return ['aobuta', (a.old && a.old[h]) || h];
    return null;
  }
  window.addEventListener('hashchange', function () {
    var t = fromHash();
    if (t) { if (qEl.value) { qEl.value = ''; qClear.hidden = true; } show(t[0], t[1], true); }
  });
  var first = fromHash(), mid = first && first[0], gid = first && first[1];
  if (!mid) {
    mid = recall('shisa.machine') || 'aobuta';
    if (!machineById(mid)) mid = MACHINES[0].id;
    gid = recall('shisa.view.' + mid) || (mid === 'aobuta' ? recall('shisa.aobuta.view') : null);
  }
  show(mid, gid, false);
})();
</script>
