<title>シサミル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 七里ヶ浜の空色のアプリ。下のタブで場面、上のチップで項目を切り替え、一度に一項目だけ見せる。結果はホールのランプ色のシール */
:root {
  --bg: #E6F2FF;
  --dot: #CFE4FA;
  --surface: #FFFFFF;
  --ink: #1B2244;
  --muted: #56618A;
  --edge: #1B2244;
  --line: #DCE6F4;
  --line-strong: #B4C6E0;
  --sky: #3797EC;
  --sky-soft: #A9D6FA;
  --track: #E3ECF7;
  --pink: #FF4F93;
  --pink-deep: #D3216A;
  --pink-soft: #FFE1EC;
  --on-pink: #FFFFFF;
  --hot: #D3216A;
  --memo-bg: #FFF5D1;
  --memo-line: #E7C65A;
  --hero-a: #86D0FF;
  --hero-b: #3797EC;
  --hero-ink: #FFFFFF;
  --hero-shadow: #1B2244;
  --hero-dot: rgba(255, 255, 255, .22);
  --img-bg: #DCE6F4;

  --lv-base-bg: #E4E9F2; --lv-base-fg: #2C3553;
  --lv-oe-bg: #FFFFFF;   --lv-oe-fg: #2C3553;
  --lv-blue: #2F6BE0; --lv-green: #13914F; --lv-gold: #F5C21B; --lv-red: #E0283D; --lv-purple: #7B3FE4;
  --lv-on: #FFFFFF; --lv-gold-fg: #2A2000;
  --rain: linear-gradient(90deg, #FF9AA8, #FFD36E, #FFF08A, #9EE6A8, #8CCBFF, #C3A6FF);
  --rain-fg: #241834;

  --scrim: rgba(8, 12, 30, .94);
  --scrim-ink: #F3F6FF;
  --scrim-muted: #AEB8D6;
  --scrim-link: #9FD3FF;
  --badge-bg: rgba(27, 34, 68, .72);
  --badge-ink: #FFFFFF;

  --font-display: 'Dela Gothic One', 'Hiragino Kaku Gothic StdN', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1330; --dot: #18214A; --surface: #172045; --ink: #EEF2FF; --muted: #A6B0D2;
    --edge: #050818; --line: #283463; --line-strong: #3B4A84;
    --sky: #58B4F7; --sky-soft: #2D4F86; --track: #252F5C;
    --pink: #FF6FA8; --pink-deep: #FF8DBA; --pink-soft: #46193A; --on-pink: #1A0B16; --hot: #FF8DBA;
    --memo-bg: #2B2611; --memo-line: #7A6420;
    --hero-a: #2A4C93; --hero-b: #15275C; --hero-ink: #F3F6FF; --hero-shadow: #050818; --hero-dot: rgba(255, 255, 255, .08);
    --img-bg: #222C57;
    --lv-base-bg: #2A3358; --lv-base-fg: #D2D9F0; --lv-oe-bg: #172045; --lv-oe-fg: #E6EBFA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1330; --dot: #18214A; --surface: #172045; --ink: #EEF2FF; --muted: #A6B0D2;
  --edge: #050818; --line: #283463; --line-strong: #3B4A84;
  --sky: #58B4F7; --sky-soft: #2D4F86; --track: #252F5C;
  --pink: #FF6FA8; --pink-deep: #FF8DBA; --pink-soft: #46193A; --on-pink: #1A0B16; --hot: #FF8DBA;
  --memo-bg: #2B2611; --memo-line: #7A6420;
  --hero-a: #2A4C93; --hero-b: #15275C; --hero-ink: #F3F6FF; --hero-shadow: #050818; --hero-dot: rgba(255, 255, 255, .08);
  --img-bg: #222C57;
  --lv-base-bg: #2A3358; --lv-base-fg: #D2D9F0; --lv-oe-bg: #172045; --lv-oe-fg: #E6EBFA;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.3px, transparent 1.8px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
/* ホーム画面アプリ版は時計などの帯を空色にして、白い文字を読みやすくする */
html.app body::before { background: var(--hero-b); }
body.locked { overflow: hidden; }
a { color: var(--sky); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
.gut {
  max-width: 880px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ヘッダー：空色の帯 */
.hero {
  background-color: var(--hero-b);
  background-image: radial-gradient(var(--hero-dot) 1.6px, transparent 2px), linear-gradient(180deg, var(--hero-a), var(--hero-b));
  background-size: 16px 16px, 100% 100%;
  color: var(--hero-ink);
  border-bottom: 3px solid var(--edge);
}
.hero .gut { padding-block: 14px 16px; display: grid; gap: 12px; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.hero-name { min-width: 0; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; opacity: .95; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* 機種のプルダウン：大きな機種名をタップすると切り替わる */
.picker { position: relative; display: block; cursor: pointer; }
.picker select {
  appearance: none; -webkit-appearance: none; width: 100%; cursor: pointer;
  font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 7.6vw, 38px); line-height: 1.2; letter-spacing: .02em;
  color: var(--hero-ink); background: transparent; border: 0; border-radius: 12px; padding: 2px 52px 4px 0; margin: 0;
  text-shadow: 0 3px 0 var(--hero-shadow), 2px 0 0 var(--hero-shadow), -2px 0 0 var(--hero-shadow), 0 -2px 0 var(--hero-shadow);
  text-overflow: ellipsis;
}
.picker select option { color: var(--ink); background: var(--surface); font-family: var(--font-body); font-size: 16px; text-shadow: none; }
.picker-btn {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%); pointer-events: none;
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); color: var(--ink); border: 2px solid var(--edge); box-shadow: 0 2px 0 var(--edge);
}
.picker-btn svg { width: 20px; height: 20px; }
.fullname { font-size: 12px; font-weight: 700; margin-top: 4px; text-wrap: balance; }
.hero-btns { display: flex; gap: 8px; }
.hbtn {
  cursor: pointer; font-size: 13px; font-weight: 700; padding: 6px 12px;
  border-radius: 999px; border: 2px solid var(--edge); background: var(--surface); color: var(--ink);
  box-shadow: 0 2px 0 var(--edge); display: inline-flex; align-items: center; gap: 4px;
}
.hbtn[aria-expanded="true"] { background: var(--pink); color: var(--on-pink); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; font-weight: 500;
  padding: 10px 64px 10px 38px; border-radius: 14px; border: 2px solid var(--edge);
  background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--edge);
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.qclear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  cursor: pointer; border: 0; background: var(--lv-base-bg); color: var(--ink);
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
}

/* 台の情報・色の見かた */
.sheet {
  margin-top: 14px; background: var(--surface); border: 2px solid var(--edge); border-radius: 18px;
  box-shadow: 0 4px 0 var(--edge); padding: 14px 16px; display: grid; gap: 12px; font-size: 13.5px;
}
.sheet h2 { margin: 0; font-size: 15px; font-weight: 900; }
.sheet p { margin: 0; }
.spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 16px; margin: 0; }
.spec div { min-width: 0; }
.spec dt { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.spec dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.sheet ul { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend-tags { display: grid; gap: 4px; color: var(--muted); }
.small { font-size: 12.5px; color: var(--muted); }

/* 項目チップ（上に固定） */
.subbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6;
  background: var(--bg); border-bottom: 2px solid var(--line);
}
.subbar .gut { padding-block: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 3px; }
.chips::-webkit-scrollbar { display: none; }
.chips.more { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
.chip {
  flex: 0 0 auto; cursor: pointer; font-size: 14px; font-weight: 700;
  padding: 7px 14px; border-radius: 999px; border: 2px solid var(--line-strong);
  background: var(--surface); color: var(--ink);
}
.chip[aria-current="true"] { background: var(--pink); color: var(--on-pink); border-color: var(--edge); box-shadow: 0 3px 0 var(--edge); }
.search-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; min-height: 38px; }
.search-head .chip { padding: 5px 12px; font-size: 13px; }

/* 本文 */
main.gut { padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px)); }
.group + .group { margin-top: 34px; }
.ghead { display: grid; gap: 4px; margin-bottom: 14px; }
.gkicker { font-size: 12px; font-weight: 700; color: var(--pink-deep); letter-spacing: .08em; }
.ghead h2 { font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1.3; margin: 0; text-wrap: balance; }
.where { font-size: 13.5px; color: var(--muted); }
.src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.src-label { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.src a {
  font-size: 12px; font-weight: 700; text-decoration: none; color: var(--ink);
  border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 2px 10px;
}
.src a::after { content: " ↗"; font-size: 11px; color: var(--muted); }
.stack { display: grid; gap: 14px; }

/* 写真カード */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.wide { grid-template-columns: minmax(0, 1fr); }
.cards.solo { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
.card {
  background: var(--surface); border: 2px solid var(--edge); border-radius: 16px;
  box-shadow: 0 3px 0 var(--edge); overflow: hidden; display: flex; flex-direction: column; min-width: 0; margin: 0;
}
.zoom {
  display: block; position: relative; width: 100%; padding: 0; border: 0; cursor: zoom-in;
  background: var(--img-bg);
}
.zoom img { display: block; width: 100%; height: auto; max-width: 100%; }
.card .zoom { border-bottom: 2px solid var(--edge); }
.hint { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--sky); }
.hint svg { width: 14px; height: 14px; }
.cbody { padding: 9px 11px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; flex: 1; min-width: 0; }
.see { font-weight: 900; font-size: 15px; line-height: 1.4; }
.sub { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: -3px; }
.res { font-size: 14px; line-height: 1.55; }
.res.hot { color: var(--hot); font-weight: 900; }
.credit { margin-top: auto; font-size: 11px; font-weight: 700; color: var(--muted); text-underline-offset: 2px; }
.card .credit { padding-top: 2px; }
.tag {
  display: inline-block; font-size: 10.5px; font-weight: 700; line-height: 1.5; color: var(--muted);
  border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; white-space: nowrap;
}
@media (max-width: 639px) {
  .cards.grid > .card:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .cards.grid > .card:last-child:nth-child(odd) .zoom img { max-width: 420px; margin: 0 auto; }
}
@media (min-width: 640px) {
  .cards.grid { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  .cards.wide { grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
}

/* 複数枚の写真は横にスワイプ */
.carousel {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
  padding-bottom: 6px; margin-inline: -4px; padding-inline: 4px;
}
.carousel > .card { flex: 0 0 82%; max-width: 380px; scroll-snap-align: start; }
.fig .cbody { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; }
.fig .see { font-size: 13.5px; font-weight: 700; }
.fig .credit { margin-top: 0; }
.single { max-width: 520px; }

/* 文字だけの一覧 */
.list {
  background: var(--surface); border: 2px solid var(--edge); border-radius: 16px;
  box-shadow: 0 3px 0 var(--edge); overflow: hidden;
}
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center;
  padding: 12px 14px;
}
.row + .row, .list > * + .row, .list > .row + * { border-top: 1.5px solid var(--line); }
.row.t { grid-template-columns: minmax(0, 1fr); gap: 3px; }
.lhs { min-width: 0; }
.lhs .sub { margin-top: 1px; }
.rshot { grid-column: 1 / -1; max-width: 460px; display: grid; gap: 4px; }
.rshot .zoom { border-radius: 12px; overflow: hidden; border: 2px solid var(--edge); }
.rshot .credit { justify-self: end; }
@media (min-width: 640px) {
  .row.t { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 6px 14px; align-items: start; }
}

/* ランプ色のシール */
.pill {
  display: inline-block; font-size: 12.5px; font-weight: 900; line-height: 1.4;
  padding: 3px 11px; border-radius: 999px; border: 1.5px solid var(--edge); white-space: nowrap;
}
.lv-base { background: var(--lv-base-bg); color: var(--lv-base-fg); }
.lv-oe { background: var(--lv-oe-bg); color: var(--lv-oe-fg); border-style: dashed; }
.lv-blue { background: var(--lv-blue); color: var(--lv-on); }
.lv-green { background: var(--lv-green); color: var(--lv-on); }
.lv-gold { background: var(--lv-gold); color: var(--lv-gold-fg); }
.lv-red { background: var(--lv-red); color: var(--lv-on); }
.lv-purple { background: var(--lv-purple); color: var(--lv-on); }
.lv-rain { background: var(--rain); color: var(--rain-fg); }

/* 期待度バー */
.cap { padding: 10px 14px; font-size: 12px; color: var(--muted); }
.brow {
  display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 2px 12px;
  padding: 10px 14px; align-items: start; border-top: 1.5px solid var(--line);
}
.blabel { font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.5; }
.bbody { min-width: 0; }
.btxt { font-size: 13px; line-height: 1.5; }
.btxt b { font-variant-numeric: tabular-nums; font-weight: 900; }
.btxt .m { color: var(--muted); }
.btxt.hot { color: var(--hot); font-weight: 900; }
.track { position: relative; height: 10px; border-radius: 5px; margin-top: 6px; background: var(--track); overflow: hidden; }
.track .ext, .track .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 5px; }
.track .ext { background: var(--sky-soft); }
.track .fill { background: var(--sky); }
.big { font-family: var(--font-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--pink-deep); }
.big small { font-family: var(--font-body); font-size: 12px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.stat .track { width: 100%; margin-top: 0; }

/* 設定差の表 */
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; border-top: 1.5px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); font-weight: 700; }
thead th { font-size: 12px; color: var(--muted); font-weight: 700; border-top: 0; }
.s6 { background: var(--pink-soft); color: var(--pink-deep); font-weight: 900; }
thead th.s6 { color: var(--pink-deep); }

/* メモ */
.memo {
  background: var(--memo-bg); border: 2px dashed var(--memo-line); border-radius: 14px;
  padding: 10px 14px; font-size: 13.5px; display: grid; gap: 4px;
}
.memo b { font-size: 12px; letter-spacing: .1em; }
.memo p { margin: 0; }

/* 前へ・次へ */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
.pager button {
  cursor: pointer; text-align: left; padding: 10px 12px; border-radius: 14px;
  border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink); min-width: 0;
}
.pager button:last-child { text-align: right; grid-column: 2; }
.pager small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.pager span { font-weight: 900; font-size: 14px; }
.foot { margin-top: 22px; font-size: 12px; color: var(--muted); }
.empty {
  padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px;
  border: 2px dashed var(--line-strong); border-radius: 16px; background: var(--surface);
}

/* 下のタブ */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding-left: max(10px, env(safe-area-inset-left, 0px));
  padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.tabs {
  pointer-events: auto; max-width: 560px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--surface); border: 2px solid var(--edge); border-radius: 22px; box-shadow: 0 4px 0 var(--edge);
  padding: 5px;
}
.tab {
  cursor: pointer; border: 0; background: transparent; color: var(--muted);
  display: grid; justify-items: center; gap: 1px; padding: 5px 2px 4px; border-radius: 16px;
  font-size: 11px; font-weight: 900; line-height: 1.3; min-width: 0;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="true"] { background: var(--pink-soft); color: var(--pink-deep); }

/* 拡大表示 */
.lb {
  border: 0; margin: 0; padding: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%;
  background: var(--scrim); color: var(--scrim-ink);
}
.lb::backdrop { background: var(--scrim); }
.lb[open] { display: flex; flex-direction: column; }
.lb-top, .lb-info {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lb-top { display: flex; align-items: center; justify-content: space-between; padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px; }
.lb-count { font-size: 13px; font-weight: 700; color: var(--scrim-muted); font-variant-numeric: tabular-nums; }
.lb-close {
  cursor: pointer; font-size: 14px; font-weight: 900; padding: 7px 16px; border-radius: 999px;
  border: 2px solid var(--scrim-ink); background: transparent; color: var(--scrim-ink);
}
.lb-stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 0 8px; touch-action: pan-y; }
.lb-stage img { max-width: min(100%, 900px); max-height: 100%; width: auto; height: auto; border-radius: 10px; object-fit: contain; }
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid var(--scrim-ink); background: var(--badge-bg); color: var(--scrim-ink); cursor: pointer;
  display: grid; place-items: center;
}
.lb-nav svg { width: 22px; height: 22px; }
.lb-nav[disabled] { opacity: .25; cursor: default; }
.lb-prev { left: max(10px, env(safe-area-inset-left, 0px)); }
.lb-next { right: max(10px, env(safe-area-inset-right, 0px)); }

<script>
(function () {
  var APP_URL = 'https://applicationsvell.github.io/slotlist/';
  var MACHINES = window.SHISA.list;
  var DIM = window.SHISA_DIM || {};

  var ICON = {
    star: '<path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/>',
    pic: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 16.5l5-5 4 4 2.5-2.5 5.5 5.5"/><circle cx="16" cy="9.5" r="1.6"/>',
    gem: '<path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M9.5 4L8 9l4 11 4-11-1.5-5"/>',
    bolt: '<path d="M13.5 2.5L5 13.5h6l-1.5 8 8.5-11h-6z"/>',
    seven: '<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 8h7l-4 9"/>',
    crown: '<path d="M3.5 18.5h17l1-11-5.5 4.5-4-7-4 7-5.5-4.5z"/>',
    eye: '<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle cx="12" cy="12" r="3"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>'
  };
  var PILL = { base: 1, oe: 1, blue: 1, green: 1, gold: 1, red: 1, purple: 1, rain: 1 };

  MACHINES.forEach(function (m) {
    m.flat = [];
    m.tabs.forEach(function (t) { t.groups.forEach(function (g) { g.tab = t; m.flat.push(g); }); });
  });
  function machineById(id) { return MACHINES.filter(function (m) { return m.id === id; })[0]; }
  function groupById(m, id) { return m.flat.filter(function (g) { return g.id === id; })[0]; }
  function link(u) { return /^https?:/.test(u) ? u : M.g + u; }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '').toLowerCase().replace(/[ァ-ヶ]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    }).replace(/\s+/g, '');
  }

  var M = null;
  function dim(im) { return DIM[M.id + '/' + im[0]] || [560, 232]; }
  function isTall(im) { var d = dim(im); return d[0] / d[1] < 1.6; }
  function imgFile(id, name) { return 'img/' + id + '/' + name + '.webp'; }

  function zoomHTML(im, res, lv) {
    var d = dim(im);
    var file = imgFile(M.id, im[0]);
    return '<button type="button" class="zoom" data-img="' + esc(file) + '" data-src="' + esc(link(im[1])) + '" data-cap="' + esc(im[2]) + '"' +
      (res ? ' data-res="' + esc(res) + '" data-lv="' + esc(lv || '') + '"' : '') + ' aria-label="' + esc(im[2] + 'を大きく見る') + '">' +
      '<img src="' + esc(file) + '" alt="' + esc(im[2]) + '" width="' + d[0] + '" height="' + d[1] + '" loading="lazy" decoding="async"></button>';
  }
  function creditHTML(im) {
    return '<a class="credit" href="' + esc(link(im[1])) + '" target="_blank" rel="noopener">出典：一撃 ↗</a>';
  }
  function resHTML(res, lv) {
    if (PILL[lv]) return '<span class="pill lv-' + lv + '">' + esc(res) + '</span>';
    return '<div class="res' + (lv === 'hot' ? ' hot' : '') + '">' + esc(res) + '</div>';
  }
  function nameHTML(it) {
    return '<div class="see">' + esc(it.see) + (it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '') + '</div>' +
      (it.sub ? '<div class="sub">' + esc(it.sub) + '</div>' : '');
  }
  function itemKey(it) { return norm([it.see, it.sub, it.res, it.tag].join(' ')); }
  function barKey(r) { return norm([r.k, r.txt, r.m, r.flag, r.extTxt].join(' ')); }

  function cardHTML(it) {
    return '<article class="card">' + zoomHTML(it.img, it.res, it.lv) +
      '<div class="cbody">' + nameHTML(it) + resHTML(it.res, it.lv) + creditHTML(it.img) + '</div></article>';
  }
  function rowHTML(it) {
    var pill = !!PILL[it.lv];
    return '<div class="row' + (pill ? '' : ' t') + '">' +
      (it.img ? '<div class="rshot">' + zoomHTML(it.img, it.res, it.lv) + creditHTML(it.img) + '</div>' : '') +
      '<div class="lhs">' + nameHTML(it) + '</div>' + resHTML(it.res, it.lv) + '</div>';
  }
  function figHTML(im) {
    return '<figure class="card fig">' + zoomHTML(im) +
      '<figcaption class="cbody"><span class="see">' + esc(im[2]) + '</span>' + creditHTML(im) + '</figcaption></figure>';
  }
  function figsHTML(list) {
    if (list.length === 1) return '<div class="single">' + figHTML(list[0]) + '</div>';
    return '<div class="carousel" aria-label="写真（横にスワイプ）">' + list.map(figHTML).join('') + '</div>';
  }
  function trackHTML(r, label) {
    return '<div class="track" role="img" aria-label="' + esc(label) + '">' +
      (r.ext ? '<span class="ext" style="width:' + r.ext + '%"></span>' : '') +
      '<span class="fill" style="width:' + r.v + '%"></span></div>';
  }
  function barHTML(r) {
    var body;
    if (r.flag) {
      body = '<div class="btxt hot">' + esc(r.flag) + '</div>' + (r.m ? '<div class="btxt"><span class="m">' + esc(r.m) + '</span></div>' : '');
    } else {
      body = '<div class="btxt"><b>' + esc(r.txt) + '</b>' + (r.m ? '<span class="m">　' + esc(r.m) + '</span>' : '') + '</div>' + trackHTML(r, r.k + ' ' + r.txt);
    }
    return '<div class="brow"><div class="blabel">' + esc(r.k) + '</div><div class="bbody">' + body + '</div></div>';
  }
  function statHTML(r) {
    var pct = r.v.toFixed(1) + '%';
    return '<article class="card stat">' + zoomHTML(r.img, (r.label || '期待度') + ' ' + pct + (r.extTxt ? '（' + r.extTxt + '）' : ''), 'hot') +
      '<div class="cbody"><div class="see">' + esc(r.k) + '</div>' +
      '<div class="big">' + esc(pct) + (r.extTxt ? '<small>' + esc(r.extTxt) + '</small>' : '') + '</div>' +
      trackHTML(r, r.k + ' ' + pct) +
      '<div class="sub" style="margin-top:0">' + esc(r.m) + '</div>' + creditHTML(r.img) + '</div></article>';
  }
  // 表：最後の列が「設定6」なら色をつける
  function tableHTML(t, rows) {
    var last = t.head.length - 1;
    var hi = t.hi != null ? t.hi : (/6/.test(t.head[last]) ? last : -1);
    var h = '<div class="list"><div class="tbl"><table style="min-width:' + (t.head.length > 4 ? t.head.length * 92 : 0) + 'px"><thead><tr>';
    t.head.forEach(function (c, i) { h += '<th' + (i === hi ? ' class="s6"' : '') + ' scope="col">' + esc(c) + '</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr>';
      r.forEach(function (c, i) {
        h += i === 0 ? '<th scope="row">' + esc(c) + '</th>' : '<td' + (i === hi ? ' class="s6"' : '') + '>' + esc(c) + '</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div>' + (t.cap ? '<div class="cap">' + esc(t.cap) + '</div>' : '') + '</div>';
  }
  function cols(n, tall, wide) {
    if (wide) return n >= 2 ? 2 : 1;
    if (n < 3) return n;
    if (!tall && n % 4 === 0) return 4;
    return 3;
  }
  function hasShots(g) {
    return !!(g.imgs || g.imgsAfter || g.stats || (g.items || []).some(function (it) { return it.img; }));
  }
  var LOUPE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>';

  // keep: 検索中だけ渡す。当てはまる行だけ残す
  function groupHTML(g, keep) {
    var all = !keep || keep(norm(g.title + ' ' + (g.where || '') + ' ' + g.short));
    function ok(k) { return all || keep(k); }
    var items = (g.items || []).filter(function (it) { return ok(itemKey(it)); });
    var chart = g.chart ? g.chart.rows.filter(function (r) { return ok(barKey(r)); }) : [];
    var stats = (g.stats || []).filter(function (r) { return ok(norm([r.k, r.m, r.extTxt].join(' '))); });
    var trows = g.table ? g.table.rows.filter(function (r) { return ok(norm(r.join(' '))); }) : [];
    var n = items.length + chart.length + stats.length + trows.length;
    if (!n && !(all && (g.imgs || g.imgsAfter))) return { html: '', n: 0 };

    var h = '<section class="group" aria-labelledby="h-' + g.id + '"><div class="ghead">' +
      (keep ? '<div class="gkicker">' + esc(g.tab.label) + '</div>' : '') +
      '<h2 id="h-' + g.id + '">' + esc(g.title) + '</h2>' +
      (g.where ? '<div class="where">' + esc(g.where) + '</div>' : '') +
      '<div class="src"><span class="src-label">出典</span>' + (g.src || [['一撃', M.g]]).map(function (s) {
        return '<a href="' + esc(link(s[1])) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>';
      }).join('') + '</div>' +
      (hasShots(g) ? '<div class="hint">' + LOUPE + '写真をタップすると大きく見られます</div>' : '') +
      '</div><div class="stack">';

    if (g.imgs && all) h += figsHTML(g.imgs);
    if (items.length) {
      var allImg = items.every(function (it) { return it.img; });
      if (allImg) {
        var pillish = items.every(function (it) { return PILL[it.lv]; });
        var view = items.length === 1 ? 'solo' : (g.view || (pillish ? 'grid' : 'wide'));
        var c = cols(items.length, isTall(items[0].img), view === 'wide');
        h += '<div class="cards ' + view + '" style="--cols:' + c + '">' + items.map(cardHTML).join('') + '</div>';
      } else {
        h += '<div class="list">' + items.map(rowHTML).join('') + '</div>';
      }
    }
    if (stats.length) {
      h += '<div class="cards ' + (stats.length === 1 ? 'solo' : 'grid') + '" style="--cols:' + cols(stats.length, false) + '">' + stats.map(statHTML).join('') + '</div>';
    }
    if (chart.length) {
      h += '<div class="list"><div class="cap">' + esc(g.chart.cap) + '</div>' + chart.map(barHTML).join('') + '</div>';
    }
    if (trows.length) h += tableHTML(g.table, trows);
    if (g.imgsAfter && all) h += figsHTML(g.imgsAfter);
    if (g.note && g.note.length && !keep) {
      h += '<div class="memo"><b>メモ</b>' + g.note.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    }
    return { html: h + '</div></section>', n: n || 1 };
  }

  var viewEl = document.getElementById('view');
  var subEl = document.getElementById('subnav');
  var tabsEl = document.getElementById('tabs');
  var qEl = document.getElementById('q');
  var qClear = document.getElementById('q-clear');
  var selEl = document.getElementById('machine');
  var current = null;
  var lastInTab = {};

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  selEl.innerHTML = MACHINES.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.short) + '</option>'; }).join('');

  // アプリ版：開いた機種の写真を先に保存して、電波がなくても見られるようにする
  function prefetch(m) {
    if (!window.APP_MODE || !('caches' in window)) return;
    var list = [];
    function add(im) { if (im) list.push(imgFile(m.id, im[0])); }
    m.flat.forEach(function (g) {
      (g.items || []).forEach(function (it) { add(it.img); });
      (g.stats || []).forEach(function (r) { add(r.img); });
      (g.imgs || []).concat(g.imgsAfter || []).forEach(add);
    });
    setTimeout(function () {
      caches.open('shisa-img').then(function (c) {
        list.forEach(function (u) { c.match(u).then(function (hit) { if (!hit) c.add(u).catch(function () {}); }); });
      }).catch(function () {});
    }, 1200);
  }

  function setMachine(m) {
    if (M === m) return;
    M = m;
    selEl.value = m.id;
    document.getElementById('m-title').textContent = m.short;
    document.getElementById('m-full').textContent = m.full;
    tabsEl.style.gridTemplateColumns = 'repeat(' + m.tabs.length + ', minmax(0, 1fr))';
    tabsEl.innerHTML = m.tabs.map(function (t) {
      return '<button type="button" class="tab" data-tab="' + t.id + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' +
        (ICON[t.icon] || ICON.star) + '</svg>' + esc(t.label) + '</button>';
    }).join('');
    document.getElementById('p-info').innerHTML =
      '<h2>' + esc(m.full) + '</h2><dl class="spec">' + m.spec.map(function (p) {
        return '<div><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>';
      }).join('') + '</dl>' +
      '<div><h2>出典</h2><ul>' + m.sources.map(function (s) {
        return '<li><a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a></li>';
      }).join('') + '</ul></div>' +
      (window.APP_MODE
        ? '<p class="small">ホーム画面アプリ版です。開いた機種の写真は端末に保存されるので、電波が弱いホールの中でも見られます。新しい内容は、電波があるときに開き直すと入ります。</p>'
        : '<div><h2>ホーム画面アプリ版</h2><p><a href="' + APP_URL + '" target="_blank" rel="noopener">' + APP_URL + '</a></p><p class="small">iPhoneはSafariで開いて「共有」→「ホーム画面に追加」。一度開けば電波がなくても見られます。</p></div>') +
      '<p class="small">画面写真は一撃の解析ページから、出典リンクを付けて引用しています。ほかのサイトはリンクのみです。示唆の中身と数値は各サイトの解析・実戦報告を要約したもので、新しい情報が出ると変わることがあります。</p>';
    store('shisa.machine', m.id);
    prefetch(m);
  }

  function scrollToContent() {
    var top = viewEl.getBoundingClientRect().top + window.pageYOffset - document.querySelector('.subbar').offsetHeight - 4;
    if (window.pageYOffset > top) window.scrollTo(0, top);
  }

  function show(mid, gid, fromUser) {
    setMachine(machineById(mid) || MACHINES[0]);
    var g = groupById(M, gid) || M.flat[0];
    current = g;
    lastInTab[M.id + '/' + g.tab.id] = g.id;
    Array.prototype.forEach.call(tabsEl.children, function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-tab') === g.tab.id ? 'true' : 'false');
    });
    subEl.innerHTML = '<div class="chips">' + g.tab.groups.map(function (x) {
      return '<button type="button" class="chip" data-g="' + x.id + '" aria-current="' + (x === g ? 'true' : 'false') + '">' + esc(x.short) + '</button>';
    }).join('') + '</div>';
    var row = subEl.querySelector('.chips');
    var fade = function () { row.classList.toggle('more', row.scrollWidth - row.clientWidth - row.scrollLeft > 4); };
    row.addEventListener('scroll', fade, { passive: true });
    var on = subEl.querySelector('[aria-current="true"]');
    if (on) row.scrollLeft = on.offsetLeft - 16;
    fade();

    var i = M.flat.indexOf(g), prev = M.flat[i - 1], next = M.flat[i + 1];
    viewEl.innerHTML = groupHTML(g).html +
      '<div class="pager">' +
      (prev ? '<button type="button" data-g="' + prev.id + '"><small>← 前へ' + (prev.tab !== g.tab ? '（' + esc(prev.tab.label) + '）' : '') + '</small><span>' + esc(prev.short) + '</span></button>' : '') +
      (next ? '<button type="button" data-g="' + next.id + '"><small>次へ' + (next.tab !== g.tab ? '（' + esc(next.tab.label) + '）' : '') + ' →</small><span>' + esc(next.short) + '</span></button>' : '') +
      '</div><p class="foot">画面写真は一撃（1geki）の解析ページから引用しています。各写真の「出典：一撃」から元のページを開けます。</p>';
    store('shisa.view.' + M.id, g.id);
    try { history.replaceState(null, '', '#' + M.id + '-' + g.id); } catch (e) {}
    if (fromUser) scrollToContent();
  }

  function search() {
    var q = norm(qEl.value);
    qClear.hidden = !qEl.value;
    if (!q) { show(M.id, current ? current.id : null, false); return; }
    var keep = function (k) { return k.indexOf(q) !== -1; };
    var total = 0, html = '';
    M.flat.forEach(function (g) { var r = groupHTML(g, keep); total += r.n; html += r.html; });
    Array.prototype.forEach.call(tabsEl.children, function (b) { b.setAttribute('aria-current', 'false'); });
    subEl.innerHTML = '<div class="search-head"><span>「' + esc(qEl.value.trim()) + '」の検索結果：' + total + '件</span><button type="button" class="chip" id="q-end">検索をやめる</button></div>';
    viewEl.innerHTML = total ? html : '<div class="empty">' + esc(M.short) + 'の中には見つかりませんでした。キャラ名を短くするか、別の言葉で試してください。</div>';
  }
  function clearSearch() { qEl.value = ''; search(); }

  qEl.addEventListener('input', search);
  qClear.addEventListener('click', function () { clearSearch(); qEl.focus(); });
  selEl.addEventListener('change', function () {
    if (qEl.value) { qEl.value = ''; qClear.hidden = true; }
    var m = machineById(selEl.value);
    show(m.id, recall('shisa.view.' + m.id), true);
  });

  subEl.addEventListener('click', function (e) {
    if (e.target.closest('#q-end')) { clearSearch(); return; }
    var b = e.target.closest('[data-g]');
    if (b) show(M.id, b.getAttribute('data-g'), true);
  });
  tabsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (!b) return;
    if (qEl.value) { qEl.value = ''; qClear.hidden = true; }
    var t = M.tabs.filter(function (x) { return x.id === b.getAttribute('data-tab'); })[0];
    show(M.id, lastInTab[M.id + '/' + t.id] || t.groups[0].id, true);
  });

  [['b-info', 'p-info'], ['b-legend', 'p-legend']].forEach(function (p, i, arr) {
    document.getElementById(p[0]).addEventListener('click', function () {
      var panel = document.getElementById(p[1]);
      var open = panel.hidden;
      arr.forEach(function (o) { document.getElementById(o[1]).hidden = true; document.getElementById(o[0]).setAttribute('aria-expanded', 'false'); });
      panel.hidden = !open;
      this.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });

  // 拡大表示
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  var lbPrev = document.getElementById('lb-prev');
  var lbNext = document.getElementById('lb-next');
  var shots = [], at = 0;
  function paint() {
    var b = shots[at];
    lbImg.src = b.getAttribute('data-img');
    lbImg.alt = b.getAttribute('data-cap');
    document.getElementById('lb-cap').textContent = b.getAttribute('data-cap');
    var res = b.getAttribute('data-res');
    document.getElementById('lb-res').innerHTML = res ? resHTML(res, b.getAttribute('data-lv')) : '';
    document.getElementById('lb-src').href = b.getAttribute('data-src');
    document.getElementById('lb-count').textContent = (at + 1) + ' / ' + shots.length;
    lbPrev.disabled = at === 0;
    lbNext.disabled = at === shots.length - 1;
  }
  function step(d) { var n = at + d; if (n >= 0 && n < shots.length) { at = n; paint(); } }
  viewEl.addEventListener('click', function (e) {
    var b = e.target.closest('.zoom');
    if (b) {
      shots = Array.prototype.slice.call(b.closest('.group').querySelectorAll('.zoom'));
      at = shots.indexOf(b);
      paint();
      if (lb.showModal) { lb.showModal(); document.body.classList.add('locked'); }
      return;
    }
    var p = e.target.closest('.pager [data-g]');
    if (p) show(M.id, p.getAttribute('data-g'), true);
  });
  lbPrev.addEventListener('click', function () { step(-1); });
  lbNext.addEventListener('click', function () { step(1); });
  document.getElementById('lb-close').addEventListener('click', function () { lb.close(); });
  lb.addEventListener('close', function () { document.body.classList.remove('locked'); });
  lb.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });
  var sx = null, sy = null;
  var stage = document.getElementById('lb-stage');
  stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (sx == null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    sx = null;
  });
  stage.addEventListener('click', function (e) { if (e.target === stage) lb.close(); });

  // 開く場所：#機種-項目 → 前のURL（#end など、青ブタ）→ 前回見ていた所
  function fromHash() {
    var h = (location.hash || '').slice(1), dash = h.indexOf('-');
    if (dash > 0 && machineById(h.slice(0, dash))) return [h.slice(0, dash), h.slice(dash + 1)];
    var a = machineById('aobuta');
    if (h && a && (groupById(a, h) || (a.old && a.old[h]))) return ['aobuta', (a.old && a.old[h]) || h];
    return null;
  }
  window.addEventListener('hashchange', function () {
    var t = fromHash();
    if (t) { if (qEl.value) { qEl.value = ''; qClear.hidden = true; } show(t[0], t[1], true); }
  });
  var first = fromHash(), mid = first && first[0], gid = first && first[1];
  if (!mid) {
    mid = recall('shisa.machine') || 'aobuta';
    if (!machineById(mid)) mid = MACHINES[0].id;
    gid = recall('shisa.view.' + mid) || (mid === 'aobuta' ? recall('shisa.aobuta.view') : null);
  }
  show(mid, gid, false);
})();
</script>
