<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>パチスロ示唆手帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 七里ヶ浜の空と海を下地に、示唆の強さはホールのランプ色（灰→青→緑→金→赤→紫→虹）で並べる一列の早見帳 */
:root {
  --bg: #EDF1F5;
  --surface: #FFFFFF;
  --ink: #141C2B;
  --muted: #586374;
  --line: #D5DDE6;
  --accent: #1A68A2;
  --on-accent: #FFFFFF;
  --sky: #BCDCF1;
  --sea: #2C7DB6;
  --bar: #2C7DB6;
  --bar-ext: #A3CBE8;
  --bar-track: #E2E8EE;

  --p-base-bg: #E6E9ED; --p-base-fg: #3C4555;
  --p-oe-bg: #FFFFFF;   --p-oe-fg: #3C4555;
  --p-blue-bg: #DCE7FB; --p-blue-fg: #1D4DA6;
  --p-green-bg: #D8F0E2; --p-green-fg: #12663D;
  --p-gold-bg: #FAEDC4; --p-gold-fg: #765100;
  --p-red-bg: #FADADC; --p-red-fg: #A11F29;
  --p-purple-bg: #EADDF9; --p-purple-fg: #59299A;
  --rain: linear-gradient(90deg, #FFB9B9, #FFD98F, #FFF2A3, #BDEFBD, #AED9FF, #D3BDFF);
  --rain-fg: #241834;

  --font-display: 'Dela Gothic One', 'Hiragino Kaku Gothic StdN', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Meiryo', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1119; --surface: #131B26; --ink: #E4EAF1; --muted: #93A0B0; --line: #243041;
    --accent: #7CB7E5; --on-accent: #0B1119; --sky: #1D3954; --sea: #4C98CF;
    --bar: #4C98CF; --bar-ext: #2B5274; --bar-track: #1D2735;
    --p-base-bg: #222B37; --p-base-fg: #B8C2CF;
    --p-oe-bg: #131B26;   --p-oe-fg: #B8C2CF;
    --p-blue-bg: #17284A; --p-blue-fg: #9CBDFF;
    --p-green-bg: #11301E; --p-green-fg: #72D8A1;
    --p-gold-bg: #392C08; --p-gold-fg: #EFC858;
    --p-red-bg: #3C1418; --p-red-fg: #FF8A8E;
    --p-purple-bg: #29194A; --p-purple-fg: #C6A5FF;
    --rain-fg: #1D1430;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1119; --surface: #131B26; --ink: #E4EAF1; --muted: #93A0B0; --line: #243041;
  --accent: #7CB7E5; --on-accent: #0B1119; --sky: #1D3954; --sea: #4C98CF;
  --bar: #4C98CF; --bar-ext: #2B5274; --bar-track: #1D2735;
  --p-base-bg: #222B37; --p-base-fg: #B8C2CF;
  --p-oe-bg: #131B26;   --p-oe-fg: #B8C2CF;
  --p-blue-bg: #17284A; --p-blue-fg: #9CBDFF;
  --p-green-bg: #11301E; --p-green-fg: #72D8A1;
  --p-gold-bg: #392C08; --p-gold-fg: #EFC858;
  --p-red-bg: #3C1418; --p-red-fg: #FF8A8E;
  --p-purple-bg: #29194A; --p-purple-fg: #C6A5FF;
  --rain-fg: #1D1430;
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 機種ヘッダー */
.kicker { font-size: 12px; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
.mast h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(24px, 6vw, 32px); line-height: 1.2; margin: 4px 0 2px;
  text-wrap: balance;
}
.fullname { color: var(--muted); font-size: 13px; text-wrap: balance; }
.machine-select { margin-top: 8px; }
.machine-select select {
  font: inherit; font-size: 15px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.horizon {
  height: 6px; border-radius: 3px; margin: 14px 0 12px;
  background: linear-gradient(to bottom, var(--sky) 0 50%, var(--sea) 50% 100%);
}
.spec {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px 16px; margin: 0;
}
.spec div { min-width: 0; }
.spec dt { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.spec dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }

.howto {
  margin-top: 16px; padding: 12px 14px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line);
  display: grid; gap: 10px; font-size: 13px;
}
.howto p { margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend-tags { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.legend-tags span { white-space: nowrap; }

/* 検索と目次 */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 12px 10px; margin-top: 14px;
  border-bottom: 1px solid var(--line);
}
.search { position: relative; }
.search input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 16px;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.search input::placeholder { color: var(--muted); }
.count { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1em; }
.count[hidden] { display: none; }
.chips {
  display: flex; gap: 6px; overflow-x: auto; padding-top: 8px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* セクション */
section.sec { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 128px); margin-top: 30px; }
section.sec h2 {
  font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.3;
  margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
section.sec h2 small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.lead { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

.group {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  margin-top: 12px; overflow: hidden;
}
.ghead { padding: 14px 16px 12px; }
.ghead h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; }
.where { font-size: 13px; color: var(--muted); margin-top: 2px; }
.src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.src-label { font-size: 11px; color: var(--muted); letter-spacing: .06em; margin-right: 2px; }
.src a {
  font-size: 12px; font-weight: 500; text-decoration: none; color: var(--accent);
  border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
}
.src a::after { content: " ↗"; font-size: 11px; }
.src a:hover { border-color: var(--accent); }

.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
  align-items: center; padding: 10px 16px; border-top: 1px solid var(--line);
}
.row.t { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); align-items: start; }
.lhs { min-width: 0; }
.see { font-weight: 700; line-height: 1.45; }
.sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
.res { font-size: 14px; line-height: 1.5; min-width: 0; }
.res.hot { color: var(--accent); font-weight: 700; }
.tag {
  display: inline-block; font-size: 11px; font-weight: 500; line-height: 1.5;
  border: 1px solid var(--muted); color: var(--muted); border-radius: 4px;
  padding: 0 5px; margin-left: 6px; vertical-align: 1px; white-space: nowrap;
}
.note {
  padding: 10px 16px 14px; font-size: 13px; color: var(--muted);
  border-top: 1px dashed var(--line);
}
.note p { margin: 0; }
.note p + p { margin-top: 4px; }

.pill {
  display: inline-block; font-size: 12.5px; font-weight: 700; line-height: 1.5;
  padding: 3px 10px; border-radius: 999px; white-space: nowrap; text-align: center;
}
.p-base { background: var(--p-base-bg); color: var(--p-base-fg); }
.p-oe { background: var(--p-oe-bg); color: var(--p-oe-fg); box-shadow: inset 0 0 0 1px var(--p-base-fg); }
.p-blue { background: var(--p-blue-bg); color: var(--p-blue-fg); }
.p-green { background: var(--p-green-bg); color: var(--p-green-fg); }
.p-gold { background: var(--p-gold-bg); color: var(--p-gold-fg); }
.p-red { background: var(--p-red-bg); color: var(--p-red-fg); }
.p-purple { background: var(--p-purple-bg); color: var(--p-purple-fg); }
.p-rain { background: var(--rain); color: var(--rain-fg); }

/* 期待度バー */
.scale-cap { padding: 0 16px 8px; font-size: 12px; color: var(--muted); }
.brow {
  display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 2px 12px;
  padding: 9px 16px; border-top: 1px solid var(--line); align-items: start;
}
.brow.wide { grid-template-columns: 6.6em minmax(0, 1fr); }
.blabel { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.45; }
.bbody { min-width: 0; }
.btxt { font-size: 13px; line-height: 1.5; }
.btxt b { font-variant-numeric: tabular-nums; }
.btxt .m { color: var(--muted); }
.btxt.hot { color: var(--accent); font-weight: 700; }
.track {
  position: relative; height: 8px; border-radius: 4px; margin-top: 5px;
  background: var(--bar-track); overflow: hidden;
}
.track .ext, .track .fill { position: absolute; top: 0; bottom: 0; left: 0; }
.track .ext { background: var(--bar-ext); }
.track .fill { background: var(--bar); }

/* 設定差の表 */
.tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table {
  border-collapse: collapse; width: 100%; min-width: 560px;
  font-size: 13px; font-variant-numeric: tabular-nums;
}
th, td { padding: 8px 10px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child {
  text-align: left; position: sticky; left: 0; background: var(--surface); font-weight: 700;
}
thead th { font-size: 12px; color: var(--muted); font-weight: 500; border-top: 0; }
thead th.s6 { color: var(--accent); font-weight: 700; }
td.s6 { font-weight: 700; }

.empty {
  margin-top: 28px; padding: 22px 16px; text-align: center; color: var(--muted);
  border: 1px dashed var(--line); border-radius: 12px; font-size: 14px;
}

footer { margin-top: 40px; font-size: 12.5px; color: var(--muted); }
footer h2 { font-size: 14px; color: var(--ink); margin: 0 0 6px; font-weight: 700; }
footer ul { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; }
footer p { margin: 10px 0 0; }

/* 一撃の画面写真（項目の横に置くサムネイルと、タップで開く拡大表示） */
.shot { margin: 0; min-width: 0; }
.shot button {
  display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in;
  border-radius: 6px; overflow: hidden;
}
.shot img {
  display: block; width: 100%; height: auto; background: var(--bar-track);
  border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line);
}
.shot figcaption { font-size: 10.5px; line-height: 1.3; margin-top: 3px; color: var(--muted); }
.shot figcaption a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.row.pic { grid-template-columns: 120px minmax(0, 1fr) auto; }
.row.t.pic { grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; }
.row.pic > .shot { align-self: start; }
.brow.wide.pic { grid-template-columns: 120px 6.6em minmax(0, 1fr); }
.brow.pic > .shot { align-self: start; }
.gshots { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.gshots .shot { width: calc(50% - 5px); max-width: 260px; }
.gshots .shot:only-child { width: 100%; max-width: 360px; }

.lb {
  border: 0; padding: 0; background: transparent; max-width: min(94vw, 760px); width: 100%;
  color: #fff;
}
.lb::backdrop { background: rgba(5, 10, 18, .86); }
.lb img { display: block; width: 100%; height: auto; border-radius: 8px; }
.lb-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13px; }
.lb-bar a { color: #A9D3F5; }
.lb-close {
  flex: 0 0 auto; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5);
  background: transparent; color: #fff;
}

@media (max-width: 520px) {
  .row.t { grid-template-columns: 1fr; }
  .row.pic, .row.t.pic { grid-template-columns: 112px minmax(0, 1fr); }
  .row.pic > .shot { grid-row: span 2; }
  .row.pic > .pill { justify-self: start; }
  .row.pic > .lhs, .row.pic > .pill, .row.pic > .res { grid-column: 2; }
  .brow.wide.pic { grid-template-columns: 112px minmax(0, 1fr); }
  .brow.pic > .shot { grid-row: span 2; }
  .brow.pic > .blabel, .brow.pic > .bbody { grid-column: 2; }
  .brow.wide { grid-template-columns: 5.4em minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>

<div class="wrap">
  <header class="mast">

  <div class="toolbar">

</div>

  // 一撃から引用した画面写真の縦横（読み込み前に場所を確保するため）
  var DIM = {"ekishou02":[560,232],"ekishou05":[560,232],"ekishou06":[560,232],"ekishou07":[560,232],"ekishou08":[560,232],"ekishou09":[560,232],"ekishou10":[560,232],"ekishou103":[560,243],"ekishou11":[560,232],"ekishou12":[560,232],"ekishou22":[560,232],"ekishou26":[560,232],"ekishou27":[560,232],"ekishou28":[560,232],"ekishou29":[560,232],"ekishou30":[560,232],"ekishou32":[560,232],"ekishou41":[560,232],"ekishou42":[560,232],"ekishou43":[560,232],"ekishou64":[560,232],"ekishou67":[560,232],"ekishou69":[560,264],"ekishou70":[561,449],"ekishou71":[561,449],"ekishou72":[561,449],"ekishou73":[561,449],"ekishou74":[561,449],"ekishou75":[561,449],"ekishou76":[561,449],"ekishou77":[561,449],"ekishou78":[561,449],"ekishou80":[560,231],"ekishou81":[560,231],"ekishou82":[560,232],"ekishou83":[560,230],"ekishou84":[560,233],"ekishou85":[560,391],"ekishou86":[561,232],"ekishou87":[561,232],"ekishou88":[561,234],"ekishou89":[561,232],"ekishou90":[561,236],"ekishou91":[561,234],"ekishou92":[561,232],"ekishou93":[561,234],"uchikata09":[560,260],"uchikata10":[560,260],"uchikata11":[560,260]};

  // img: [ファイル名, 一撃ページ内の場所, 説明]
  function shotHTML(im) {
    var d = DIM[im[0]] || [560, 232];
    var file = 'img/' + im[0] + '.webp', url = G + im[1];
    return '<figure class="shot"><button type="button" class="zoom" data-img="' + esc(file) + '" data-src="' + esc(url) + '" data-cap="' + esc(im[2]) + '" aria-label="' + esc(im[2] + 'を拡大') + '">' +
      '<img src="' + esc(file) + '" alt="' + esc(im[2]) + '" width="' + d[0] + '" height="' + d[1] + '" loading="lazy" decoding="async"></button>' +
      '<figcaption><a href="' + esc(url) + '" target="_blank" rel="noopener">出典：一撃</a></figcaption></figure>';
  }

  var PILL = { base: 'p-base', oe: 'p-oe', blue: 'p-blue', green: 'p-green', gold: 'p-gold', red: 'p-red', purple: 'p-purple', rain: 'p-rain' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '').toLowerCase().replace(/[ァ-ヶ]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0x60);
    }).replace(/\s+/g, '');
  }

  function rowHTML(it) {
    var key = norm([it.see, it.sub, it.res, it.tag].join(' '));
    var pic = it.img ? shotHTML(it.img) : '';
    var lhs = pic + '<div class="lhs"><div class="see">' + esc(it.see) +
      (it.tag ? '<span class="tag">' + esc(it.tag) + '</span>' : '') + '</div>' +
      (it.sub ? '<div class="sub">' + esc(it.sub) + '</div>' : '') + '</div>';
    if (PILL[it.lv]) {
      return '<div class="row f' + (pic ? ' pic' : '') + '" data-k="' + esc(key) + '">' + lhs +
        '<span class="pill ' + PILL[it.lv] + '">' + esc(it.res) + '</span></div>';
    }
    return '<div class="row t f' + (pic ? ' pic' : '') + '" data-k="' + esc(key) + '">' + lhs +
      '<div class="res' + (it.lv === 'hot' ? ' hot' : '') + '">' + esc(it.res) + '</div></div>';
  }

  function barRowHTML(r, wide) {
    var key = norm([r.k, r.txt, r.m, r.flag].join(' '));
    var body;
    if (r.flag) {
      body = '<div class="btxt hot">' + esc(r.flag) + '</div>' +
        (r.m ? '<div class="btxt"><span class="m">' + esc(r.m) + '</span></div>' : '');
    } else {
      body = '<div class="btxt"><b>' + esc(r.txt) + '</b>' + (r.m ? '<span class="m">　' + esc(r.m) + '</span>' : '') + '</div>' +
        '<div class="track" role="img" aria-label="' + esc(r.k + ' ' + r.txt) + '">' +
        (r.ext ? '<span class="ext" style="width:' + r.ext + '%"></span>' : '') +
        '<span class="fill" style="width:' + r.v + '%"></span></div>';
    }
    return '<div class="brow f' + (wide ? ' wide' : '') + (r.img ? ' pic' : '') + '" data-k="' + esc(key) + '">' + (r.img ? shotHTML(r.img) : '') + '<div class="blabel">' + esc(r.k) + '</div><div class="bbody">' + body + '</div></div>';
  }

  function tableHTML(t) {
    var h = '<div class="tbl"><table><thead><tr>';
    t.head.forEach(function (c, i) { h += '<th' + (i === 5 ? ' class="s6"' : '') + ' scope="col">' + esc(c) + '</th>'; });
    h += '</tr></thead><tbody>';
    t.rows.forEach(function (r) {
      h += '<tr class="f" data-k="' + esc(norm(r.join(' '))) + '">';
      r.forEach(function (c, i) {
        h += i === 0 ? '<th scope="row">' + esc(c) + '</th>' : '<td' + (i === 5 ? ' class="s6"' : '') + '>' + esc(c) + '</td>';
      });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function groupHTML(g) {
    var h = '<div class="group" data-g="' + esc(norm(g.title + ' ' + (g.where || ''))) + '"><div class="ghead"><h3>' + esc(g.title) + '</h3>';
    if (g.where) h += '<div class="where">' + esc(g.where) + '</div>';
    if (g.src && g.src.length) {
      h += '<div class="src"><span class="src-label">画像・出典</span>';
      g.src.forEach(function (s) { h += '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>'; });
      h += '</div>';
    }
    if (g.imgs && g.imgs.length) h += '<div class="gshots">' + g.imgs.map(shotHTML).join('') + '</div>';
    h += '</div>';
    (g.items || []).forEach(function (it) { h += rowHTML(it); });
    if (g.chart) {
      h += '<div class="scale-cap">' + esc(g.chart.cap) + '</div>';
      g.chart.rows.forEach(function (r) { h += barRowHTML(r, false); });
    }
    if (g.bars) {
      h += '<div class="scale-cap">' + esc(g.bars.cap) + '</div>';
      g.bars.rows.forEach(function (r) { h += barRowHTML(r, true); });
    }
    if (g.table) h += tableHTML(g.table);
    if (g.note && g.note.length) {
      h += '<div class="note">' + g.note.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    }
    return h + '</div>';
  }

  var mainEl = document.getElementById('main');
  var chipsEl = document.getElementById('chips');
  var qEl = document.getElementById('q');
  var countEl = document.getElementById('count');
  var emptyEl = document.getElementById('empty');
  var current = MACHINES[0];
  var observer = null;

  function renderMachine(m) {
    current = m;
    document.getElementById('m-short').textContent = m.short;
    document.getElementById('m-full').textContent = m.full;
    document.getElementById('m-spec').innerHTML = m.spec.map(function (p) {
      return '<div><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>';
    }).join('');

    chipsEl.innerHTML = m.sections.map(function (s, i) {
      return '<button type="button" class="chip' + (i === 0 ? ' on' : '') + '" data-to="' + esc(s.id) + '">' + esc(s.title) + '</button>';
    }).join('');

    mainEl.innerHTML = m.sections.map(function (s) {
      return '<section class="sec" id="' + esc(s.id) + '"><h2>' + esc(s.title) + (s.en ? '<small>' + esc(s.en) + '</small>' : '') + '</h2>' +
        s.groups.map(groupHTML).join('') + '</section>';
    }).join('');

    document.getElementById('foot').innerHTML =
      '<h2>出典</h2><ul>' + m.sources.map(function (s) {
        return '<li><a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a></li>';
      }).join('') + '</ul>' +
      '<p>画面写真の出典：<a href="' + esc(G) + '" target="_blank" rel="noopener">一撃（1geki）L青春ブタ野郎 解析ページ</a>。各写真の下のリンクから該当ページを開けます。</p>' +
      '<p>示唆の中身と数値は、各サイトの解析・実戦報告を要約したものです。新しい情報が出ると変わることがあるので、気になる演出は元サイトでも確認してください。</p>';

    watchSections();
    filter();
  }

  function setActive(id) {
    Array.prototype.forEach.call(chipsEl.children, function (c) {
      var on = c.getAttribute('data-to') === id;
      c.classList.toggle('on', on);
      if (on && c.scrollIntoView) {
        var box = chipsEl.getBoundingClientRect(), r = c.getBoundingClientRect();
        if (r.left < box.left || r.right > box.right) chipsEl.scrollLeft += r.left - box.left - 16;
      }
    });
  }

  function watchSections() {
    if (observer) observer.disconnect();
    if (!('IntersectionObserver' in window)) return;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-140px 0px -60% 0px' });
    Array.prototype.forEach.call(mainEl.querySelectorAll('section.sec'), function (s) { observer.observe(s); });
  }

  function filter() {
    var q = norm(qEl.value);
    var total = 0;
    Array.prototype.forEach.call(mainEl.querySelectorAll('section.sec'), function (sec) {
      var secHas = false;
      Array.prototype.forEach.call(sec.querySelectorAll('.group'), function (g) {
        var groupMatch = !q || g.getAttribute('data-g').indexOf(q) !== -1;
        var n = 0;
        Array.prototype.forEach.call(g.querySelectorAll('.f'), function (r) {
          var show = groupMatch || r.getAttribute('data-k').indexOf(q) !== -1;
          r.hidden = !show;
          if (show) n++;
        });
        var caps = g.querySelectorAll('.scale-cap');
        Array.prototype.forEach.call(caps, function (c) { c.hidden = !!q && n === 0; });
        g.hidden = n === 0;
        if (n) { secHas = true; total += n; }
      });
      sec.hidden = !secHas;
    });
    if (q) {
      countEl.hidden = false;
      countEl.textContent = total + '件が見つかりました';
    } else {
      countEl.hidden = true;
    }
    emptyEl.hidden = total !== 0;
  }

  qEl.addEventListener('input', filter);

  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lb-img');
  mainEl.addEventListener('click', function (e) {
    var b = e.target.closest('.zoom');
    if (!b) return;
    lbImg.src = b.getAttribute('data-img');
    lbImg.alt = b.getAttribute('data-cap');
    document.getElementById('lb-cap').textContent = b.getAttribute('data-cap');
    document.getElementById('lb-src').href = b.getAttribute('data-src');
    if (lb.showModal) lb.showModal(); else window.open(b.getAttribute('data-img'), '_blank');
  });
  document.getElementById('lb-close').addEventListener('click', function () { lb.close(); });
  lb.addEventListener('click', function (e) { if (e.target === lb) lb.close(); });

  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    if (qEl.value) { qEl.value = ''; filter(); }
    var el = document.getElementById(b.getAttribute('data-to'));
    if (!el) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    setActive(el.id);
  });

  var sel = document.getElementById('machine');
  if (MACHINES.length > 1) {
    document.getElementById('m-select').hidden = false;
    sel.innerHTML = MACHINES.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.short) + '</option>'; }).join('');
    sel.addEventListener('change', function () {
      var m = MACHINES.filter(function (x) { return x.id === sel.value; })[0];
      if (m) renderMachine(m);
    });
  }

  renderMachine(MACHINES[0]);

  var h = (location.hash || '').slice(1);
  if (h && document.getElementById(h)) {
    setTimeout(function () { document.getElementById(h).scrollIntoView({ block: 'start' }); setActive(h); }, 50);
  }
})();
